    </div>
    <div id="football-player-video-wrap">
      <video id="football-player-video" controls controlslist="nodownload nofullscreen noremoteplayback" disablepictureinpicture playsinline webkit-playsinline preload="metadata"></video>

  <script>
  (() => {
    const overlay=document.getElementById('football-player-overlay');
    const video=document.getElementById('football-player-video');
    const titleEl=document.getElementById('football-player-title');
    const serverButton=document.getElementById('football-player-server');
    const qualityButton=document.getElementById('football-player-quality');
    const menuPanel=document.getElementById('football-player-menu');
    const menuTitle=document.getElementById('football-player-menu-title');
    const menuItems=document.getElementById('football-player-menu-items');
    const messageEl=document.getElementById('football-player-message');
    const closeButton=document.getElementById('football-player-close');
    const fitButton=document.getElementById('football-player-fit');
    const rotateButton=document.getElementById('football-player-rotate');
    const fullscreenButton=document.getElementById('football-player-fullscreen');
    const videoWrap=document.getElementById('football-player-video-wrap');
    let sources=[], shakaPlayer=null, mpegtsPlayer=null, currentTracks=[];
    let currentSourceIndex=0;
    let currentMatchId='';
    let controlsTimer=null;
    let autoFallbackTried=new Set();
    let playbackToken=0;
    let playbackStartedToken=-1;
    let bufferingReportedToken=-1;
    let startupTimer=null, stallTimer=null, fallbackTimer=null;
    let fallbackScheduledToken=-1, awaitingPlayToken=-1;
    let activePlayingHandler=null;
    let playbackTeardown=Promise.resolve();
    let manualRotation=0;
    const iosRecoveryAttempts=new Map();
    const startupTimeoutMs=20000, stallTimeoutMs=15000;
    const scriptLoads=new Map();

    function capturePlayerEvent(name,properties={}){
      try{
        if(window.posthog && typeof window.posthog.capture==='function'){
          window.posthog.capture(name,{
            app:'nca_viewer',
            platform:'web',
            ...(currentMatchId?{match_id:currentMatchId}:{}),
            ...properties
          });
        }
      }catch(_){}
    }

    function loadScriptOnce(src,key){
      if(window[key]) return Promise.resolve();
      if(scriptLoads.has(src)) return scriptLoads.get(src);
      const promise=new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        script.src=src;
        script.async=true;
        script.onload=()=>{
          if(window[key]) resolve();
          else reject(new Error(key+' player engine loaded without a global.'));
        };
        script.onerror=()=>reject(new Error('Could not load '+key+' player engine.'));
        document.head.appendChild(script);
      }).catch(error=>{
        // A transient CDN/network failure must not poison later retries.
        scriptLoads.delete(src);
        throw error;
      });
      scriptLoads.set(src,promise);
      return promise;
    }

    async function loadScriptFallback(urls,key){
      let lastError=null;
      for(const src of urls){
        try{
          await loadScriptOnce(src,key);
          if(window[key]) return;
        }catch(error){
          lastError=error;
        }
      }
      throw lastError||new Error('Could not load '+key+' player engine.');
    }

    function sameOriginAsset(path){
      try{
        if(location.protocol==='http:'||location.protocol==='https:'){
          return new URL(path,document.baseURI).toString();
        }
      }catch(_){}
      return '';
    }

    async function ensurePlayerEngine(type,url){
      if(type==='flv'){
        await loadScriptFallback([
          'https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js'
        ],'mpegts');
        return;
      }
      if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
        if(type==='hls' && isIOS() &&
            video.canPlayType('application/vnd.apple.mpegurl')) return;
        const local=sameOriginAsset('vendor/shaka-player.compiled.js');
        await loadScriptFallback([
          ...(local?[local]:[]),
          'https://ajax.googleapis.com/ajax/libs/shaka-player/5.2.12/shaka-player.compiled.js',
          'https://cdn.jsdelivr.net/npm/shaka-player@5.2.12/dist/shaka-player.compiled.js'
        ],'shaka');
      }
    }

    function hideControls(){
      document.getElementById('football-player-topbar').classList.add('controls-hidden');
    }

    function revealControls(){
      const bar=document.getElementById('football-player-topbar');
      bar.classList.remove('controls-hidden');
      if(controlsTimer)clearTimeout(controlsTimer);
      controlsTimer=setTimeout(hideControls,3000);
    }

    function showMessage(text){messageEl.textContent=text||'';messageEl.style.display=text?'block':'none'}

    function isCurrentPlayback(token){
      return token===playbackToken && overlay.classList.contains('open');
    }

    function clearPlaybackWatchdogs(){
      if(startupTimer!==null)clearTimeout(startupTimer);
      if(stallTimer!==null)clearTimeout(stallTimer);
      startupTimer=null;stallTimer=null;
    }

    function cancelPlaybackTimers(){
      clearPlaybackWatchdogs();
      if(fallbackTimer!==null)clearTimeout(fallbackTimer);
      fallbackTimer=null;fallbackScheduledToken=-1;
    }

    function armStartupWatchdog(index,token){
      if(startupTimer!==null)clearTimeout(startupTimer);
      startupTimer=setTimeout(()=>{
        startupTimer=null;
        if(isCurrentPlayback(token) && awaitingPlayToken!==token){
          fallbackToNextLine(index,'This line did not start in time',token,'startup_timeout');
        }
      },startupTimeoutMs);
    }

    function isIOSRecoverableSource(index){
      const source=sources[index]||{};
      const type=sourceType(source);
      const url=String(source.url||'').toLowerCase();
      return isIOS() && (
        type==='hls' ||
        type==='m3u8' ||
        type==='dash' ||
        type==='mpd' ||
        url.includes('.m3u8') ||
        url.includes('.mpd')
      );
    }

    function retryIOSSource(index,token){
      if(!isCurrentPlayback(token) || !isIOSRecoverableSource(index))return false;
      const attempts=iosRecoveryAttempts.get(index)||0;
      if(attempts>=2)return false;
      iosRecoveryAttempts.set(index,attempts+1);
      clearPlaybackWatchdogs();
      showMessage('Stream paused • reconnecting…');
      fallbackTimer=setTimeout(()=>{
        fallbackTimer=null;
        if(isCurrentPlayback(token))loadSource(index,false);
      },350);
      return true;
    }

    function armStallWatchdog(){
      const token=playbackToken, index=currentSourceIndex;
      if(!isCurrentPlayback(token) || playbackStartedToken!==token ||
          awaitingPlayToken===token || stallTimer!==null || video.paused)return;
      const currentType=sourceType(sources[index]||{});
      const watchdogMs=isIOS() && currentType==='dash'
        ? 25000
        : isIOS()
          ? 12000
          : stallTimeoutMs;
      stallTimer=setTimeout(()=>{
        stallTimer=null;
        if(isCurrentPlayback(token) && !video.paused){
          if(retryIOSSource(index,token))return;
          fallbackToNextLine(index,'This line stopped responding',token,'stall_timeout');
        }
      },watchdogMs);
    }

    function safeErrorDetails(error){
      const details={};
      for(const [key,value] of [
        ['error_code',error&&error.code],
        ['error_category',error&&error.category]
      ]){
        if(typeof value==='number' && Number.isInteger(value) && value>=0 && value<1000000){
          details[key]=value;
        }
      }
      return details;
    }

    function playbackFailure(error,index,token){
      const drmError=error && error.category===6;
      return fallbackToNextLine(
        index,
        drmError?'This line needs a compatible DRM player':'This line could not be played in this browser',
        token,
        drmError?'drm_error':'playback_error',
        safeErrorDetails(error)
      );
    }

    function showPlayPrompt(index,token){
      clearPlaybackWatchdogs();
      awaitingPlayToken=token;
      showMessage('Tap Play to start this line. ');
      const button=document.createElement('button');
      button.type='button';button.className='football-control';
      button.textContent='Play';
      button.addEventListener('click',()=>{
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        awaitingPlayToken=-1;
        armStartupWatchdog(index,token);
        requestVideoPlay(index,token);
      });
      messageEl.appendChild(button);
      revealControls();
    }

    async function requestVideoPlay(index,token){
      try{
        // Call play before awaiting so an explicit tap retains user activation.
        await video.play();
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        showMessage('');
      }catch(error){
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        if(error && error.name==='NotAllowedError'){
          showPlayPrompt(index,token);
          capturePlayerEvent('playback needs user interaction',{
            selected_index:index,
            stream_type:sourceType(sources[index]||{})
          });
          return;
        }
        // A source change can abort play without indicating a broken stream.
        if(error && error.name==='AbortError')return;
        await playbackFailure(error,index,token);
      }
    }

    function isIOS(){
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    }

    function hasWebKitStreamingEngine(){
      return !!(window.ManagedMediaSource || window.MediaSource);
    }

    function sourceSupport(source){
      const type=sourceType(source);
      const keyId=String(source.keyId||source.key_id||'').trim();
      const keyData=String(source.keyData||source.key_data||'').trim();

      if(isIOS() && type==='dash'){
        if(!hasWebKitStreamingEngine()){
          return {
            ok:false,
            reason:'DASH needs modern iOS WebKit (iOS 17.1+) or an HLS backup'
          };
        }
        if(keyId&&keyData && !(window.crypto&&window.crypto.subtle)){
          return {
            ok:false,
            reason:'Encrypted DASH needs WebCrypto on this iPhone/iPad'
          };
        }
        return {
          ok:true,
          reason:keyId&&keyData
            ? 'DASH • ClearKey playback will be attempted on this iPhone/iPad'
            : 'DASH • browser compatibility will be checked by the player'
        };
      }

      if(type==='flv' && window.mpegts && typeof mpegts.isSupported==='function'){
        if(!mpegts.isSupported()){
          return {ok:true, reason:'Browser support may be limited'};
        }
      }

      return {ok:true, reason:''};
    }

    async function fallbackToNextLine(failedIndex,message,token,reason='line_unavailable',details={}){
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      fallbackScheduledToken=token;
      clearPlaybackWatchdogs();
      try{video.pause()}catch(_){}
      autoFallbackTried.add(failedIndex);
      const failed=sources[failedIndex]||{};
      capturePlayerEvent('playback line failed',{
        selected_index:failedIndex,
        line_count:sources.length,
        stream_type:sourceType(failed),
        reason,
        ...details
      });

      const candidates=[...sources.keys()].filter(i=>!autoFallbackTried.has(i));
      if(isIOS()){
        const rank=(i)=>{
          const type=sourceType(sources[i]);
          if(type==='hls')return 0;
          if(type==='dash')return 1;
          if(type==='mp4')return 2;
          if(type==='auto')return 3;
          if(type==='flv')return 9;
          return 5;
        };
        candidates.sort((a,b)=>rank(a)-rank(b));
      }

      if(candidates.length){
        const nextIndex=candidates[0];
        capturePlayerEvent('playback auto fallback',{
          from_index:failedIndex,
          to_index:nextIndex,
          line_count:sources.length
        });
        showMessage((message||'Line unavailable')+' • trying backup line…');
        fallbackTimer=setTimeout(()=>{
          fallbackTimer=null;
          if(isCurrentPlayback(token) && fallbackScheduledToken===token){
            loadSource(nextIndex,false);
          }
        },450);
        return;
      }

      showMessage((message||'No working line')+(isIOS() && sourceType(failed)==='dash'
        ? ' • No working backup. A compatible HLS line is needed for this match.'
        : ' • Tap Line to choose again.'));
    }

    function closePlayerMenu(){
      menuPanel.classList.add('hidden');
      menuItems.innerHTML='';
    }

    function openLineMenu(){
      revealControls();
      menuTitle.textContent='Choose line';
      menuItems.innerHTML='';
      sources.forEach((source,index)=>{
        const type=sourceType(source).toUpperCase();
        const support=sourceSupport(source);
        const item=document.createElement('button');
        item.type='button';
        item.className='football-menu-item'+
          (index===currentSourceIndex?' current':'');
        item.disabled=false;
        const label=String(source.label||source.resolution||('Server '+(index+1)));
        item.innerHTML=
          '<span class="football-menu-item-main">'+
          '<span class="football-menu-item-label">'+escapeHtml(label)+'</span>'+
          '<span class="football-menu-item-sub">'+escapeHtml(
            support.reason || (type==='AUTO'?'Auto / Direct':type)
          )+'</span>'+
          '</span>'+
          (index===currentSourceIndex?'<span class="football-menu-item-badge">PLAYING</span>':'');
        item.addEventListener('click',()=>{
          closePlayerMenu();
          capturePlayerEvent('playback line selected',{
            selected_index:index,
            line_count:sources.length,
            stream_type:sourceType(source)
          });
          loadSource(index,true);
        });
        menuItems.appendChild(item);
      });
      menuPanel.classList.remove('hidden');
    }

    function openQualityMenu(){
      revealControls();
      menuTitle.textContent='Video quality';
      menuItems.innerHTML='';

      const auto=document.createElement('button');
      auto.type='button';
      auto.className='football-menu-item'+(qualityButton.dataset.mode!=='manual'?' current':'');
      auto.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">Auto</span><span class="football-menu-item-sub">Adaptive quality</span></span>';
      auto.addEventListener('click',()=>{
        if(shakaPlayer) shakaPlayer.configure({abr:{enabled:true}});
        qualityButton.textContent='Auto';
        qualityButton.dataset.mode='auto';
        capturePlayerEvent('playback quality selected',{quality:'auto'});
        closePlayerMenu();
      });
      menuItems.appendChild(auto);

      currentTracks.forEach(track=>{
        const item=document.createElement('button');
        item.type='button';
        const label=(track.height||'?')+'p';
        item.className='football-menu-item'+(qualityButton.dataset.trackId===String(track.id)?' current':'');
        item.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">'+escapeHtml(label)+'</span><span class="football-menu-item-sub">Manual quality</span></span>';
        item.addEventListener('click',()=>{
          if(shakaPlayer){
            shakaPlayer.configure({abr:{enabled:false}});
            shakaPlayer.selectVariantTrack(track,true);
          }
          qualityButton.textContent=label;
          qualityButton.dataset.mode='manual';
          qualityButton.dataset.trackId=String(track.id);
          capturePlayerEvent('playback quality selected',{quality:label});
          closePlayerMenu();
        });
        menuItems.appendChild(item);
      });

      if(currentTracks.length===0){
        const info=document.createElement('div');
        info.className='football-menu-item unsupported';
        info.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">Auto only</span><span class="football-menu-item-sub">This browser/source does not expose manual qualities.</span></span>';
        menuItems.appendChild(info);
      }

      menuPanel.classList.remove('hidden');
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function destroyPlayback(){
      const previousShaka=shakaPlayer, previousMpegts=mpegtsPlayer;
      shakaPlayer=null;mpegtsPlayer=null;
      if(activePlayingHandler){video.removeEventListener('playing',activePlayingHandler);activePlayingHandler=null}
      showMessage(''); currentTracks=[];
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
      try{video.pause()}catch(_){}
      video.onerror=null;
      try{video.removeAttribute('src');video.load()}catch(_){}
      if(previousMpegts){
        try{previousMpegts.pause()}catch(_){}
        try{previousMpegts.unload()}catch(_){}
        try{previousMpegts.detachMediaElement()}catch(_){}
        try{previousMpegts.destroy()}catch(_){}
      }
      // Complete earlier teardown before another player attaches to this video.
      playbackTeardown=playbackTeardown.catch(()=>{}).then(async()=>{
        if(previousShaka){try{await previousShaka.destroy()}catch(_){}}
      });
      await playbackTeardown;
    }

    function sourceType(source){
      const declared=String(source.streamType||source.stream_type||'auto').toLowerCase();
      if(declared==='m3u8')return 'hls';
      if(declared==='mpd')return 'dash';
      if(['hls','dash','mp4','flv'].includes(declared))return declared;
      const u=String(source.url||'').toLowerCase();
      if(u.includes('.m3u8'))return 'hls';
      if(u.includes('.mpd'))return 'dash';
      if(u.includes('.flv'))return 'flv';
      if(u.includes('.mp4'))return 'mp4';
      return 'auto';
    }

    function browserHeaderWarning(source){
      return (source.referer||source.origin)
        ? 'This line requires Referer/Origin. Chrome may block it unless the stream server allows browser CORS/referrer access.'
        : '';
    }

    function updateServerButton(index){
      const source=sources[index]||{};
      serverButton.textContent=String(
        source.label||source.resolution||('Server '+(index+1))
      );
    }

    function fillQualityOptions(){
      const unique=new Map();
      currentTracks.forEach(track=>{
        const h=track.height||0, bw=track.bandwidth||0;
        if(h>0){
          const key=String(h), old=unique.get(key);
          if(!old||bw>(old.bandwidth||0)) unique.set(key,track);
        }
      });
      currentTracks=[...unique.values()]
        .sort((a,b)=>(b.height||0)-(a.height||0));
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
    }

    async function loadSource(index,userSelected=false){
      if(!sources.length){showMessage('No stream source.');return}
      if(userSelected)autoFallbackTried.clear();
      index=Math.max(0,Math.min(Number(index)||0,sources.length-1));
      const source=sources[index], url=String(source.url||'').trim(), type=sourceType(source);
      const support=sourceSupport(source);

      currentSourceIndex=index;
      updateServerButton(index);
      closePlayerMenu();
      const token=++playbackToken;
      cancelPlaybackTimers();awaitingPlayToken=-1;
      armStartupWatchdog(index,token);
      await destroyPlayback();
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      const onPlaying=()=>{
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        clearPlaybackWatchdogs();awaitingPlayToken=-1;showMessage('');
        if(playbackStartedToken===token)return;
        playbackStartedToken=token;
        capturePlayerEvent('playback started',{
          selected_index:index,
          line_count:sources.length,
          stream_type:type,
          resolution:/^(\d{3,4}p|auto|hd|sd|fhd|uhd|4k)$/i.test(String(source.resolution||''))
            ? String(source.resolution).toLowerCase() : 'unknown',
          health_status:['healthy','unknown','slow','failed'].includes(source.healthStatus||source.health_status)
            ? (source.healthStatus||source.health_status) : 'unknown'
        });
      };
      activePlayingHandler=onPlaying;
      video.addEventListener('playing',onPlaying);
      if(!url){await fallbackToNextLine(index,'This line has no stream URL',token,'empty_source');return}
      if(!support.ok){
        await fallbackToNextLine(index,support.reason,token,'unsupported_browser');
        return;
      }
      try{
        await ensurePlayerEngine(type,url);
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        if(type==='flv'){
          if(!window.mpegts||!mpegts.isSupported())throw new Error('FLV is not supported by this browser.');
          mpegtsPlayer=mpegts.createPlayer({type:'flv',isLive:true,url});
          mpegtsPlayer.attachMediaElement(video);mpegtsPlayer.load();
          await requestVideoPlay(index,token);return;
        }
        if((type==='hls'||url.includes('.m3u8')) &&
            isIOS() &&
            video.canPlayType('application/vnd.apple.mpegurl')){
          video.onerror=()=>{
            if(retryIOSSource(index,token))return;
            fallbackToNextLine(
              index,
              'HLS line failed in this browser',
              token,
              'native_hls_error',
              safeErrorDetails(video.error)
            );
          };
          video.src=url;
          await requestVideoPlay(index,token);
          return;
        }
        if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
          if(!window.shaka)throw new Error('Web streaming engine did not load.');
          shaka.polyfill.installAll();
          if(!shaka.Player.isBrowserSupported())throw new Error('This browser does not support DASH/HLS through the web player.');
          const player=new shaka.Player();
          shakaPlayer=player;
          await player.attach(video);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          const iosDash=isIOS() && type==='dash';
          player.configure({
            manifest:{
              retryParameters:{
                maxAttempts:iosDash?7:5,
                baseDelay:iosDash?450:300,
                backoffFactor:1.5,
                fuzzFactor:.2,
                timeout:iosDash?12000:8000
              },
              dash:{
                autoCorrectDrift:true
              }
            },
            streaming:{
              rebufferingGoal:iosDash?8:2,
              bufferingGoal:iosDash?36:12,
              bufferBehind:iosDash?30:10,
              segmentPrefetchLimit:iosDash?3:1,
              updateIntervalSeconds:iosDash?2:1,
              safeSeekEndOffset:iosDash?5:0,
              stallEnabled:true,
              stallThreshold:iosDash?3:1,
              stallSkip:.1,
              allowMediaSourceRecoveries:true,
              minTimeBetweenRecoveries:iosDash?3:5,
              retryParameters:{
                maxAttempts:iosDash?7:5,
                baseDelay:iosDash?450:300,
                backoffFactor:1.5,
                fuzzFactor:.2,
                timeout:iosDash?12000:8000
              }
            },
            abr:iosDash?{
              enabled:true,
              useNetworkInformation:false,
              defaultBandwidthEstimate:700000,
              switchInterval:10,
              restrictions:{maxHeight:720}
            }:undefined
          });
          const rawKeyId=String(source.keyId||source.key_id||'').trim();
          const rawKeyData=String(source.keyData||source.key_data||'').trim();
          const keyId=rawKeyId.replace(/[^0-9a-f]/gi,'').toLowerCase();
          const keyData=rawKeyData.replace(/[^0-9a-f]/gi,'').toLowerCase();
          if(keyId&&keyData){
            if(keyId.length!==32||keyData.length!==32){
              throw new Error('Invalid ClearKey format.');
            }
            const clearKeys={};clearKeys[keyId]=keyData;
            const drmConfig={clearKeys};
            if(!isIOS()) drmConfig.preferredKeySystems=['org.w3.clearkey'];
            player.configure({drm:drmConfig});
          }
          player.addEventListener('error',event=>{
            const detail=event&&event.detail?event.detail:{};
            playbackFailure(detail,index,token);
          });
          const manifestMime=type==='dash'?'application/dash+xml':'application/vnd.apple.mpegurl';
          await player.load(url,undefined,manifestMime);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          currentTracks=player.getVariantTracks(); fillQualityOptions();
          await requestVideoPlay(index,token);return;
        }
        video.src=url;
        video.onerror=()=>fallbackToNextLine(index,'Browser video playback failed',token,'native_video_error',safeErrorDetails(video.error));
        await requestVideoPlay(index,token);
      }catch(error){
        await playbackFailure(error,index,token);
      }
    }

    serverButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openLineMenu();
      else closePlayerMenu();
    });
    qualityButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openQualityMenu();
      else closePlayerMenu();
    });
    closeButton.addEventListener('click',async()=>{
      capturePlayerEvent('playback closed',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
      ++playbackToken;cancelPlaybackTimers();awaitingPlayToken=-1;
      if(controlsTimer)clearTimeout(controlsTimer);
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      await destroyPlayback();
    });
    overlay.addEventListener('pointermove',()=>{if(overlay.classList.contains('open'))revealControls()});
    overlay.addEventListener('pointerup',event=>{
      if(event.target===video||event.target===document.getElementById('football-player-video-wrap')){
        closePlayerMenu();
        revealControls();
      }
    });
    fitButton.addEventListener('click',()=>{
      const fill=video.classList.toggle('fill');
      fitButton.textContent=fill?'Fit':'Fill';
    });
    function clearManualRotation(){
      manualRotation=0;
      video.style.transform='';
      video.style.width='100%';
      video.style.height='100%';
      rotateButton.textContent='↻ Rotate';
    }

    function applyManualRotation(){
      const angle=((manualRotation%360)+360)%360;
      video.style.transform='rotate('+angle+'deg)';
      if(angle===90||angle===270){
        const w=videoWrap.clientWidth||window.innerWidth||1;
        const h=videoWrap.clientHeight||window.innerHeight||1;
        video.style.width=h+'px';
        video.style.height=w+'px';
      }else{
        video.style.width='100%';
        video.style.height='100%';
      }
      rotateButton.textContent=angle?'↻ '+angle+'°':'↻ Rotate';
    }

    async function rotatePlayer(){
      revealControls();
      try{
        const orientation=
          typeof screen!=='undefined' ? screen.orientation : null;
        if(orientation && typeof orientation.lock==='function'){
          if(!document.fullscreenElement && overlay.requestFullscreen){
            await overlay.requestFullscreen();
          }
          const landscape=String(orientation.type||'').startsWith('landscape');
          await orientation.lock(landscape?'portrait-primary':'landscape');
          clearManualRotation();
          return;
        }
      }catch(_){}

      manualRotation=(manualRotation+90)%360;
      applyManualRotation();
    }

    rotateButton.addEventListener('click',rotatePlayer);
    fullscreenButton.addEventListener('click',async()=>{
      try{
        // Non-iOS browsers fullscreen the entire NCA overlay, not the video,
        // so Line/Quality/Fill controls remain usable after rotation.
        if(video.webkitEnterFullscreen && isIOS()){
          video.webkitEnterFullscreen();
          return;
        }
        if(!document.fullscreenElement) await overlay.requestFullscreen();
        else await document.exitFullscreen();
        revealControls();
      }catch(_){}
    });
    document.addEventListener('fullscreenchange',()=>{
      fullscreenButton.textContent=document.fullscreenElement?'Exit':'Fullscreen';
      if(!document.fullscreenElement &&
          typeof screen!=='undefined' &&
          screen.orientation &&
          typeof screen.orientation.unlock==='function'){
        try{screen.orientation.unlock()}catch(_){}
      }
      if(manualRotation)applyManualRotation();
      if(overlay.classList.contains('open')) revealControls();
    });
    if(typeof screen!=='undefined' && screen.orientation){
      screen.orientation.addEventListener?.('change',()=>{
        if(manualRotation)applyManualRotation();
        if(overlay.classList.contains('open')) revealControls();
      });
    }
    window.addEventListener?.('resize',()=>{
      if(manualRotation)applyManualRotation();
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.classList.contains('open')&&!document.fullscreenElement)closeButton.click()});
    video.addEventListener('waiting',()=>{
      if(!overlay.classList.contains('open'))return;
      armStallWatchdog();
      if(bufferingReportedToken===playbackToken)return;
      bufferingReportedToken=playbackToken;
      capturePlayerEvent('playback buffering',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
    });
    video.addEventListener('stalled',armStallWatchdog);
    video.addEventListener('pause',()=>{
      if(stallTimer!==null)clearTimeout(stallTimer);
      stallTimer=null;
    });
    video.addEventListener('ended',()=>{
      capturePlayerEvent('playback ended',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
    });

    window.openFootballPlayer=async(sourcesJson,selectedIndex,title,matchId)=>{
      try{const parsed=JSON.parse(String(sourcesJson||'[]'));sources=Array.isArray(parsed)?parsed.filter(x=>x&&x.url):[]}catch(_){sources=[]}
      autoFallbackTried.clear();
      iosRecoveryAttempts.clear();
      currentMatchId=String(matchId||'').trim();
      titleEl.textContent=String(title||'NCA');
      let startIndex=Math.max(0,Math.min(Number(selectedIndex)||0,sources.length-1));
      if(isIOS() && sources[startIndex]){
        if(sourceType(sources[startIndex])==='flv'){
          const hlsIndex=sources.findIndex(source=>sourceType(source)==='hls');
          if(hlsIndex>=0) startIndex=hlsIndex;
        }
      }
      currentSourceIndex=startIndex;
      updateServerButton(startIndex);
      video.classList.remove('fill');
      fitButton.textContent='Fill';
      clearManualRotation();
      overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      hideControls();
      await loadSource(startIndex);
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
