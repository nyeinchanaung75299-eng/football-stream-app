<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Football Live web viewer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b3d2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Football Live</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f6f8f7}
    body{overflow:hidden}
    #football-player-overlay{display:none;position:fixed;inset:0;z-index:2147483647;background:#000;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #football-player-overlay.open{display:flex;flex-direction:column}
    #football-player-topbar{position:absolute;top:0;left:0;right:0;z-index:3;min-height:56px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(0,0,0,.76);box-sizing:border-box;flex-wrap:wrap;transition:opacity .18s ease}
    #football-player-topbar.controls-hidden{opacity:0;pointer-events:none}
    #football-player-title{font-weight:800;flex:1 1 220px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
    #football-player-video-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#000}
    #football-player-video{width:100%;height:100%;object-fit:contain;background:#000}
    #football-player-video.fill{object-fit:fill}
    #football-player-message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(680px,88vw);padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;text-align:center;line-height:1.4;display:none}
    .football-control{min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.22);border-radius:10px;color:#fff;background:#171717;font-weight:800}
    button.football-control{cursor:pointer}
    #football-player-server,#football-player-quality{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #football-player-menu{position:absolute;z-index:5;top:62px;right:10px;width:min(360px,calc(100vw - 20px));max-height:min(64vh,520px);overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:16px;background:#121212;box-shadow:0 16px 40px rgba(0,0,0,.45);color:#fff}
    #football-player-menu.hidden{display:none}
    #football-player-menu-title{padding:12px 14px 8px;font-size:13px;font-weight:900;color:#bdbdbd;text-transform:uppercase;letter-spacing:.05em}
    #football-player-menu-items{max-height:min(56vh,450px);overflow-y:auto;padding:4px 8px 10px;-webkit-overflow-scrolling:touch}
    .football-menu-item{width:100%;display:flex;align-items:center;gap:10px;min-height:52px;margin:4px 0;padding:9px 10px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:#1d1d1d;color:#fff;text-align:left}
    .football-menu-item.current{border-color:#38b979;background:#173128}
    .football-menu-item.unsupported{opacity:.48}
    .football-menu-item-main{min-width:0;flex:1}
    .football-menu-item-label{display:block;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .football-menu-item-sub{display:block;margin-top:2px;font-size:12px;color:#bdbdbd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .football-menu-item-badge{flex:0 0 auto;font-size:11px;font-weight:900;color:#8fe3b9}
    @media(max-width:720px){
      #football-player-topbar{gap:6px;padding:6px}
      #football-player-title{flex-basis:calc(100% - 58px)}
      .football-control{min-height:36px;padding:0 9px}
      #football-player-server,#football-player-quality{max-width:132px}
      #football-player-menu{top:102px;left:8px;right:8px;width:auto;max-height:62vh}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.js"></script>
</head>
<body>
  <div id="football-player-overlay" aria-hidden="true">
    <div id="football-player-topbar">
      <button id="football-player-close" class="football-control" type="button">← Back</button>
      <div id="football-player-title">Football Live</div>
      <button id="football-player-server" class="football-control" type="button" aria-label="Choose line">Line</button>
      <button id="football-player-quality" class="football-control" type="button" aria-label="Choose quality">Auto</button>
      <button id="football-player-fit" class="football-control" type="button">Fit</button>
      <button id="football-player-fullscreen" class="football-control" type="button">Fullscreen</button>
    </div>
    <div id="football-player-menu" class="hidden" role="dialog" aria-modal="false">
      <div id="football-player-menu-title"></div>
      <div id="football-player-menu-items"></div>
    </div>
    <div id="football-player-video-wrap">
      <video id="football-player-video" class="fill" controls playsinline></video>
      <div id="football-player-message"></div>
    </div>
  </div>
  <script>
  (() => {
    const overlay=document.getElementById('football-player-overlay');
    const video=document.getElementById('football-player-video');
    const titleEl=document.getElementById('football-player-title');
    const serverButton=document.getElementById('football-player-server');
    const qualityButton=document.getElementById('football-player-quality');
    const menuPanel=document.getElementById('football-player-menu');
    const menuTitle=document.getElementById('football-player-menu-title');
    const menuItems=document.getElementById('football-player-menu-items');
    const messageEl=document.getElementById('football-player-message');
    const closeButton=document.getElementById('football-player-close');
    const fitButton=document.getElementById('football-player-fit');
    const fullscreenButton=document.getElementById('football-player-fullscreen');
    let sources=[], shakaPlayer=null, mpegtsPlayer=null, currentTracks=[];
    let currentSourceIndex=0;
    let controlsTimer=null;
    let autoFallbackTried=new Set();
    let playbackToken=0;

    function hideControls(){
      document.getElementById('football-player-topbar').classList.add('controls-hidden');
    }

    function revealControls(){
      const bar=document.getElementById('football-player-topbar');
      bar.classList.remove('controls-hidden');
      if(controlsTimer)clearTimeout(controlsTimer);
      controlsTimer=setTimeout(hideControls,3000);
    }

    function showMessage(text){messageEl.textContent=text||'';messageEl.style.display=text?'block':'none'}

    function isIOS(){
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    }

    function sourceSupport(source){
      const type=sourceType(source);

      // Do not blacklist a line only because of iOS/Safari.
      // Browser capabilities change over time and some iOS/WebKit builds can
      // play sources that older builds could not. We attempt playback first.
      if(type==='flv' && window.mpegts && typeof mpegts.isSupported==='function'){
        if(!mpegts.isSupported()){
          return {ok:true, reason:'Browser support may be limited'};
        }
      }

      return {ok:true, reason:''};
    }

    async function fallbackToNextLine(failedIndex,message,token){
      if(token!==playbackToken) return;
      autoFallbackTried.add(failedIndex);

      for(let i=0;i<sources.length;i++){
        if(!autoFallbackTried.has(i)){
          showMessage((message||'Line unavailable')+' • trying backup line…');
          setTimeout(()=>loadSource(i,false),450);
          return;
        }
      }

      showMessage((message||'No working line')+' • Tap Line to choose again.');
      autoFallbackTried.clear();
    }

    function closePlayerMenu(){
      menuPanel.classList.add('hidden');
      menuItems.innerHTML='';
    }

    function openLineMenu(){
      revealControls();
      menuTitle.textContent='Choose line';
      menuItems.innerHTML='';
      sources.forEach((source,index)=>{
        const type=sourceType(source).toUpperCase();
        const support=sourceSupport(source);
        const item=document.createElement('button');
        item.type='button';
        item.className='football-menu-item'+
          (index===currentSourceIndex?' current':'');
        item.disabled=false;
        const label=String(source.label||source.resolution||('Server '+(index+1)));
        item.innerHTML=
          '<span class="football-menu-item-main">'+
          '<span class="football-menu-item-label">'+escapeHtml(label)+'</span>'+
          '<span class="football-menu-item-sub">'+escapeHtml(
            support.reason || (type==='AUTO'?'Auto / Direct':type)
          )+'</span>'+
          '</span>'+
          (index===currentSourceIndex?'<span class="football-menu-item-badge">PLAYING</span>':'');
        item.addEventListener('click',()=>{
          closePlayerMenu();
          autoFallbackTried.clear();
          loadSource(index,true);
        });
        menuItems.appendChild(item);
      });
      menuPanel.classList.remove('hidden');
    }

    function openQualityMenu(){
      revealControls();
      menuTitle.textContent='Video quality';
      menuItems.innerHTML='';

      const auto=document.createElement('button');
      auto.type='button';
      auto.className='football-menu-item'+(qualityButton.dataset.mode!=='manual'?' current':'');
      auto.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">Auto</span><span class="football-menu-item-sub">Adaptive quality</span></span>';
      auto.addEventListener('click',()=>{
        if(shakaPlayer) shakaPlayer.configure({abr:{enabled:true}});
        qualityButton.textContent='Auto';
        qualityButton.dataset.mode='auto';
        closePlayerMenu();
      });
      menuItems.appendChild(auto);

      currentTracks.forEach(track=>{
        const item=document.createElement('button');
        item.type='button';
        const label=(track.height||'?')+'p';
        item.className='football-menu-item'+(qualityButton.dataset.trackId===String(track.id)?' current':'');
        item.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">'+escapeHtml(label)+'</span><span class="football-menu-item-sub">Manual quality</span></span>';
        item.addEventListener('click',()=>{
          if(shakaPlayer){
            shakaPlayer.configure({abr:{enabled:false}});
            shakaPlayer.selectVariantTrack(track,true);
          }
          qualityButton.textContent=label;
          qualityButton.dataset.mode='manual';
          qualityButton.dataset.trackId=String(track.id);
          closePlayerMenu();
        });
        menuItems.appendChild(item);
      });

      if(currentTracks.length===0){
        const info=document.createElement('div');
        info.className='football-menu-item unsupported';
        info.innerHTML='<span class="football-menu-item-main"><span class="football-menu-item-label">Auto only</span><span class="football-menu-item-sub">This browser/source does not expose manual qualities.</span></span>';
        menuItems.appendChild(info);
      }

      menuPanel.classList.remove('hidden');
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function destroyPlayback(){
      showMessage(''); currentTracks=[];
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
      try{video.pause()}catch(_){}
      video.onerror=null;
      try{video.removeAttribute('src');video.load()}catch(_){}
      if(mpegtsPlayer){
        try{mpegtsPlayer.pause()}catch(_){}
        try{mpegtsPlayer.unload()}catch(_){}
        try{mpegtsPlayer.detachMediaElement()}catch(_){}
        try{mpegtsPlayer.destroy()}catch(_){}
        mpegtsPlayer=null;
      }
      if(shakaPlayer){try{await shakaPlayer.destroy()}catch(_){} shakaPlayer=null}
    }

    function sourceType(source){
      const declared=String(source.streamType||source.stream_type||'auto').toLowerCase();
      if(declared!=='auto')return declared;
      const u=String(source.url||'').toLowerCase();
      if(u.includes('.m3u8'))return 'hls';
      if(u.includes('.mpd'))return 'dash';
      if(u.includes('.flv'))return 'flv';
      if(u.includes('.mp4'))return 'mp4';
      return 'auto';
    }

    function browserHeaderWarning(source){
      return (source.referer||source.origin)
        ? 'This line requires Referer/Origin. Chrome may block it unless the stream server allows browser CORS/referrer access.'
        : '';
    }

    function updateServerButton(index){
      const source=sources[index]||{};
      serverButton.textContent=String(
        source.label||source.resolution||('Server '+(index+1))
      );
    }

    function fillQualityOptions(){
      const unique=new Map();
      currentTracks.forEach(track=>{
        const h=track.height||0, bw=track.bandwidth||0;
        if(h>0){
          const key=String(h), old=unique.get(key);
          if(!old||bw>(old.bandwidth||0)) unique.set(key,track);
        }
      });
      currentTracks=[...unique.values()]
        .sort((a,b)=>(b.height||0)-(a.height||0));
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
    }

    async function loadSource(index,userSelected=false){
      if(!sources.length){showMessage('No stream source.');return}
      index=Math.max(0,Math.min(Number(index)||0,sources.length-1));
      const source=sources[index], url=String(source.url||'').trim(), type=sourceType(source);
      const support=sourceSupport(source);

      currentSourceIndex=index;
      updateServerButton(index);
      closePlayerMenu();
      const token=++playbackToken;
      await destroyPlayback();
      if(!url){showMessage('This line has no stream URL.');return}
      const warning=browserHeaderWarning(source);
      try{
        if(type==='flv'){
          if(!window.mpegts||!mpegts.isSupported())throw new Error('FLV is not supported by this browser.');
          mpegtsPlayer=mpegts.createPlayer({type:'flv',isLive:true,url});
          mpegtsPlayer.attachMediaElement(video);mpegtsPlayer.load();await video.play().catch(()=>{});
          if(warning)showMessage(warning);return;
        }
        if((type==='hls'||url.includes('.m3u8')) &&
            video.canPlayType('application/vnd.apple.mpegurl')){
          video.onerror=()=>fallbackToNextLine(
            index,
            'HLS line failed in this browser',
            token
          );
          video.src=url;
          await video.play().catch(()=>{});
          if(warning)showMessage(warning);
          return;
        }
        if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
          if(!window.shaka)throw new Error('Web streaming engine did not load.');
          shaka.polyfill.installAll();
          if(!shaka.Player.isBrowserSupported())throw new Error('This browser does not support the web player.');
          shakaPlayer=new shaka.Player();
          await shakaPlayer.attach(video);
          const keyId=String(source.keyId||source.key_id||'').trim();
          const keyData=String(source.keyData||source.key_data||'').trim();
          if(keyId&&keyData){const clearKeys={};clearKeys[keyId]=keyData;shakaPlayer.configure({drm:{clearKeys}})}
          shakaPlayer.addEventListener('error',event=>{
            const detail=event&&event.detail?event.detail:{};
            fallbackToNextLine(
              index,
              'Playback error'+(detail.code?' ('+detail.code+')':''),
              token
            );
          });
          await shakaPlayer.load(url);
          currentTracks=shakaPlayer.getVariantTracks(); fillQualityOptions();
          await video.play().catch(()=>{});
          if(warning)showMessage(warning); return;
        }
        video.src=url;
        video.addEventListener('error',()=>showMessage('This line could not be played in the browser. Try another line or the Android app.'),{once:true});
        await video.play().catch(()=>{});
        if(warning)showMessage(warning);
      }catch(error){
        console.error(error);
        await fallbackToNextLine(
          index,
          error&&error.message?error.message:'Playback failed',
          token
        );
      }
    }

    serverButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openLineMenu();
      else closePlayerMenu();
    });
    qualityButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openQualityMenu();
      else closePlayerMenu();
    });
    closeButton.addEventListener('click',async()=>{await destroyPlayback();overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true')});
    overlay.addEventListener('pointermove',()=>{if(overlay.classList.contains('open'))revealControls()});
    overlay.addEventListener('pointerup',event=>{
      if(event.target===video||event.target===document.getElementById('football-player-video-wrap')){
        closePlayerMenu();
        revealControls();
      }
    });
    fitButton.addEventListener('click',()=>{
      const fill=video.classList.toggle('fill');
      fitButton.textContent=fill?'Fit':'Fill';
    });
    fullscreenButton.addEventListener('click',async()=>{
      try{
        if(video.webkitEnterFullscreen && isIOS()){
          video.webkitEnterFullscreen();
          return;
        }
        if(!document.fullscreenElement) await overlay.requestFullscreen();
        else await document.exitFullscreen();
      }catch(_){}
    });
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.classList.contains('open')&&!document.fullscreenElement)closeButton.click()});

    window.openFootballPlayer=async(sourcesJson,selectedIndex,title)=>{
      try{const parsed=JSON.parse(String(sourcesJson||'[]'));sources=Array.isArray(parsed)?parsed.filter(x=>x&&x.url):[]}catch(_){sources=[]}
      autoFallbackTried.clear();
      titleEl.textContent=String(title||'Football Live');
      let startIndex=Math.max(0,Math.min(Number(selectedIndex)||0,sources.length-1));
      if(isIOS() && sources[startIndex] && sourceType(sources[startIndex])==='flv'){
        const hlsIndex=sources.findIndex(source=>sourceType(source)==='hls');
        if(hlsIndex>=0) startIndex=hlsIndex;
      }
      currentSourceIndex=startIndex;
      updateServerButton(startIndex);
      video.classList.add('fill');
      fitButton.textContent='Fit';
      overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      hideControls();
      await loadSource(startIndex);
    };
  })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
