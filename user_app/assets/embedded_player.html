    }
    #football-player-overlay.ios-native-mode #football-player-topbar{

    }
    #football-player-overlay.ios-native-mode #football-player-title{
      flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
    }
    #football-player-overlay.ios-native-mode #football-player-quality{
      flex:0 0 44px;min-width:44px;max-width:44px;width:44px;

    }
    #football-player-overlay.ios-native-mode #football-player-fit,
    #football-player-overlay.ios-native-mode #football-player-rotate{

    #football-player-overlay.ios-native-mode #football-player-rotate svg{

    @media (orientation:portrait){

    @media (orientation:landscape){

         the controls instead of reserving space for them. */
      #football-player-overlay.open{justify-content:flex-start!important}
      #football-player-overlay #football-player-topbar{
        position:absolute!important;top:0;left:0;right:0;
        min-height:44px;z-index:6;
        background:linear-gradient(to bottom,rgba(0,0,0,.67),rgba(0,0,0,.09));
      }
      #football-player-overlay.ios-native-mode #football-player-video-wrap,
      #football-player-overlay:not(.ios-native-mode) #football-player-video-wrap{
        flex:1 1 auto;height:100%;min-height:0;
      }
      #football-player-overlay.ios-native-mode #football-player-topbar.controls-hidden,
      #football-player-overlay:not(.ios-native-mode) #football-player-topbar.controls-hidden{
        opacity:0!important;pointer-events:none!important;
      }
      #football-player-overlay.ios-native-mode #football-player-line-rail{
        position:relative;bottom:auto;top:auto;flex:0 0 auto;
      }
    }
    /* Safari native fullscreen is owned by iOS; keep in-page controls
       outside the video so they never conflict with Apple transport UI. */
    #football-player-overlay.ios-native-mode #football-player-fit,
    #football-player-overlay.ios-native-mode #football-player-rotate{
      display:inline-flex!important;align-items:center;justify-content:center;
    }

<body>

        <div id="football-player-menu-title"></div>

  <script>
  (() => {
    const overlay=document.getElementById('football-player-overlay');
    const video=document.getElementById('football-player-video');
    const titleEl=document.getElementById('football-player-title');
    const serverButton=document.getElementById('football-player-server');
    const qualityButton=document.getElementById('football-player-quality');
    const menuPanel=document.getElementById('football-player-menu');
    const menuTitle=document.getElementById('football-player-menu-title');
    const menuBackButton=document.getElementById('football-player-menu-back');
    const menuCloseButton=document.getElementById('football-player-menu-close');
    let settingsSection='video';
    const menuItems=document.getElementById('football-player-menu-items');
    const messageEl=document.getElementById('football-player-message');
    const closeButton=document.getElementById('football-player-close');
    const fitButton=document.getElementById('football-player-fit');
    const rotateButton=document.getElementById('football-player-rotate');
    const fullscreenButton=document.getElementById('football-player-fullscreen');
    const iosFullscreenButton=document.getElementById('football-player-ios-fullscreen');
    const videoWrap=document.getElementById('football-player-video-wrap');
    const videoFrame=document.getElementById('football-player-video-frame');
    const lineRail=document.getElementById('football-player-line-rail');
    const lineItems=document.getElementById('football-player-line-items');
    const customControls=document.getElementById('football-player-custom-controls');
    const playPauseButton=document.getElementById('nca-play-pause');
    const progressInput=document.getElementById('nca-player-progress');
    const timeLabel=document.getElementById('nca-player-time');
    const settingsButton=document.getElementById('nca-player-settings');
    let sources=[], shakaPlayer=null, mpegtsPlayer=null, currentTracks=[];
    let currentSourceIndex=0;
    let currentMatchId='', currentSessionId='';
    let controlsTimer=null;
    let displayMode='fit';
    let autoFallbackTried=new Set();
    let playbackToken=0;
    let playbackStartedToken=-1;
    let playbackAttemptStartedAt=0, activeBuffering=null;
    let startupTimer=null, stallTimer=null, fallbackTimer=null, progressTimer=null;
    let fallbackScheduledToken=-1, awaitingPlayToken=-1;
    let activePlayingHandler=null;
    let playbackTeardown=Promise.resolve();
    let manualRotation=0;
    let lastPlaybackTime=NaN;
    const iosRecoveryAttempts=new Map();
    const startupTimeoutMs=20000, stallTimeoutMs=15000, engineTimeoutMs=5000;
    const scriptLoads=new Map();

    function playbackClock(){
      return window.performance&&typeof window.performance.now==='function'
        ? window.performance.now() : Date.now();
    }

    function playbackProperties(index=currentSourceIndex){
      const source=sources[index]||{};
      const rawId=String(source.id||source.lineId||source.linkId||'');
      let route='';
      try{
        const parsed=new URL(String(source.url||''));
        if(parsed.protocol==='http:'||parsed.protocol==='https:')route=parsed.hostname;
      }catch(_){}
      return {
        selected_index:index,
        line_count:sources.length,
        stream_type:sourceType(source),
        ...(/^[A-Za-z0-9_:-]{1,128}$/.test(rawId)?{line_id:rawId}:{}),
        ...(route?{route}:{}),
      };
    }

    function capturePlayerEvent(name,properties={}){
      try{
        if(window.posthog && typeof window.posthog.capture==='function'){
          window.posthog.capture(name,{
            app:'nca_viewer',
            platform:'web',
            ...(currentMatchId?{match_id:currentMatchId}:{}),
            ...playbackProperties(),
            ...properties
          });
        }
      }catch(_){}
    }

    function beginBuffering(index,token){
      if(!isCurrentPlayback(token)||document.hidden||activeBuffering?.token===token)return;
      activeBuffering={token,startedAt:playbackClock(),
        phase:playbackStartedToken===token?'rebuffer':'startup'};
      capturePlayerEvent('playback buffering',{
        ...playbackProperties(index),phase:activeBuffering.phase
      });
    }

    function finishBuffering(index,token){
      if(!isCurrentPlayback(token)||activeBuffering?.token!==token)return;
      const buffering=activeBuffering;
      activeBuffering=null;
      capturePlayerEvent('playback buffering ended',{
        ...playbackProperties(index),phase:buffering.phase,
        buffering_ms:Math.max(0,Math.round(playbackClock()-buffering.startedAt))
      });
    }

    function loadScriptOnce(src,key){
      if(window[key]) return Promise.resolve();
      if(scriptLoads.has(src)) return scriptLoads.get(src);
      const promise=new Promise((resolve,reject)=>{
        const script=document.createElement('script');
        let settled=false;
        const finish=error=>{
          if(settled)return;
          settled=true;
          clearTimeout(timer);
          script.onload=null;script.onerror=null;
          if(error){script.remove();reject(error)}else resolve();
        };
        const timer=setTimeout(()=>finish(new Error(key+' player engine timed out.')),engineTimeoutMs);
        script.src=src;
        script.async=true;
        script.onload=()=>finish(window[key]?null:new Error(key+' player engine loaded without a global.'));
        script.onerror=()=>finish(new Error('Could not load '+key+' player engine.'));
        document.head.appendChild(script);
      }).catch(error=>{
        // Failed or hung downloads must not poison a later manual retry.
        scriptLoads.delete(src);
        throw error;
      });
      scriptLoads.set(src,promise);
      return promise;
    }

    async function loadScriptFallback(urls,key){
      let lastError=null;
      for(const src of urls){
        try{
          await loadScriptOnce(src,key);
          if(window[key]) return;
        }catch(error){
          lastError=error;
        }
      }
      throw lastError||new Error('Could not load '+key+' player engine.');
    }

    function sameOriginAsset(path){
      try{
        if(location.protocol==='http:'||location.protocol==='https:'){
          return new URL(path,document.baseURI).toString();
        }
      }catch(_){}
      return '';
    }

    async function ensurePlayerEngine(type,url){
      if(type==='flv'){
        const local=sameOriginAsset('vendor/mpegts.js?v=1.8.2');
        await loadScriptFallback([
          ...(local?[local]:[]),
          'https://cdn.jsdelivr.net/npm/mpegts.js@1.8.2/dist/mpegts.js'
        ],'mpegts');
        return;
      }
      if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
        if(type==='hls' && isIOS() &&
            video.canPlayType('application/vnd.apple.mpegurl')) return;
        // iOS needs the 5.2 ClearKey WebCrypto path; bypass older cached bundles.
        const local=sameOriginAsset('vendor/shaka-player.compiled.js'+(isIOS()?'?v=5.2.12':''));
        await loadScriptFallback([
          ...(local?[local]:[]),
          'https://ajax.googleapis.com/ajax/libs/shaka-player/5.2.12/shaka-player.compiled.js',
          'https://cdn.jsdelivr.net/npm/shaka-player@5.2.12/dist/shaka-player.compiled.js'
        ],'shaka');
      }
    }

    function hideControls(){
      // Keep the line/quality controls available while a chooser menu is open.
      if(!menuPanel.classList.contains('hidden'))return;
      document.getElementById('football-player-topbar').classList.add('controls-hidden');
      lineRail.classList.add('controls-hidden');
      customControls.classList.add('controls-hidden');
    }

    function revealControls(){
      const bar=document.getElementById('football-player-topbar');
      bar.classList.remove('controls-hidden');
      lineRail.classList.remove('controls-hidden');
      customControls.classList.remove('controls-hidden');
      if(controlsTimer)clearTimeout(controlsTimer);
      controlsTimer=setTimeout(hideControls,5000);
    }

    function showMessage(text){messageEl.textContent=text||'';messageEl.style.display=text?'block':'none'}

    function layoutIOSVideoFrame(){
      if(!overlay.classList.contains('ios-native-mode') || video.webkitDisplayingFullscreen)return;
      const width=videoWrap.clientWidth,height=videoWrap.clientHeight;
      if(!width || height<=0)return;
      const ratio=video.videoWidth>0 && video.videoHeight>0
        ? video.videoWidth/video.videoHeight : 16/9;
      const pictureWidth=Math.min(width,height*ratio);
      videoFrame.style.width=pictureWidth+'px';
      videoFrame.style.height=(pictureWidth/ratio)+'px';
    }

    function layoutVideoFrame(){
      if(overlay.classList.contains('ios-native-mode')){
        layoutIOSVideoFrame();
        return;
      }
      // Source aspect ratio is preserved in Fit; the portrait VIDEO BOX is
      // sized by CSS, never by a wide cropped aspect-ratio preset.
      videoFrame.style.width='100%';
      videoFrame.style.height='100%';
    }

    function syncIOSSystemRotationControls(){
      const systemRotationOnly=isIOS();
      const topbar=document.getElementById('football-player-topbar');

      if(systemRotationOnly){
        // Keep Apple's native player/fullscreen/system rotation, and retain
        // only Back + Line + Quality as a compact strip outside the video.
        clearManualRotation();
        closePlayerMenu();
        overlay.classList.add('ios-native-mode');
        topbar?.classList.remove('controls-hidden');

        video.controls=true;
        video.classList.remove('nca-custom-fullscreen');
        video.removeAttribute('controlslist');
        video.removeAttribute('disablepictureinpicture');
        video.removeAttribute('disableremoteplayback');
        video.setAttribute('x-webkit-airplay','allow');
      }else{
        overlay.classList.remove('ios-native-mode');
        videoFrame.style.width='';
        videoFrame.style.height='';
        if(topbar)topbar.style.display='';
        video.classList.add('nca-custom-fullscreen');
        video.setAttribute(
          'controlslist',
          'nodownload nofullscreen noremoteplayback'
        );
        video.setAttribute('disablepictureinpicture','');
        video.removeAttribute('x-webkit-airplay');
      }
    }

    function isCurrentPlayback(token){
      return token===playbackToken && overlay.classList.contains('open');
    }

    function clearPlaybackWatchdogs(){
      if(startupTimer!==null)clearTimeout(startupTimer);
      if(stallTimer!==null)clearTimeout(stallTimer);
      startupTimer=null;stallTimer=null;
    }

    function clearProgressWatchdog(){
      if(progressTimer!==null)clearTimeout(progressTimer);
      progressTimer=null;
    }

    function cancelPlaybackTimers(){
      clearPlaybackWatchdogs();
      clearProgressWatchdog();
      if(fallbackTimer!==null)clearTimeout(fallbackTimer);
      fallbackTimer=null;fallbackScheduledToken=-1;
    }

    function armStartupWatchdog(index,token){
      if(startupTimer!==null)clearTimeout(startupTimer);
      const timeoutMs=isIOS()
        ? (sourceType(sources[index]||{})==='dash'?30000:12000)
        : startupTimeoutMs;
      startupTimer=setTimeout(()=>{
        startupTimer=null;
        if(isCurrentPlayback(token) && awaitingPlayToken!==token){
          fallbackToNextLine(index,'This line did not start in time',token,'startup_timeout');
        }
      },timeoutMs);
    }

    function isIOSRecoverableSource(index){
      const source=sources[index]||{};
      const type=sourceType(source);
      const url=String(source.url||'').toLowerCase();
      return isIOS() && (
        type==='hls' ||
        type==='m3u8' ||
        type==='dash' ||
        type==='mpd' ||
        type==='flv' ||
        url.includes('.m3u8') ||
        url.includes('.mpd')
      );
    }

    function retryIOSSource(index,token){
      if(!isCurrentPlayback(token) || !isIOSRecoverableSource(index))return false;
      if(fallbackScheduledToken===token)return true;
      const attempts=iosRecoveryAttempts.get(index)||0;
      if(attempts>=1)return false;
      iosRecoveryAttempts.set(index,attempts+1);
      fallbackScheduledToken=token;
      clearPlaybackWatchdogs();
      clearProgressWatchdog();
      showMessage('Stream paused • reconnecting…');
      fallbackTimer=setTimeout(()=>{
        fallbackTimer=null;
        if(isCurrentPlayback(token))loadSource(index,false);
      },350);
      return true;
    }

    function armProgressWatchdog(index,token){
      const initialTime=Number(video.currentTime);
      if(!Number.isFinite(initialTime) || !Number.isFinite(Number(video.readyState))){
        return;
      }
      clearProgressWatchdog();
      let lastTime=initialTime;
      let stuckTicks=0;

      const check=()=>{
        progressTimer=null;
        if(!isCurrentPlayback(token) || video.paused || video.ended)return;

        const now=Number(video.currentTime)||0;
        if(video.seeking || document.hidden){
          stuckTicks=0;
          lastTime=now;
        }else if(now>lastTime+0.05){
          stuckTicks=0;
          lastTime=now;
        }else{
          stuckTicks+=1;
        }

        // An empty buffer must also count as a freeze. Allow segment retries
        // time to finish instead of tearing down iOS playback after 5–8s.
        if(stuckTicks>=8){
          beginBuffering(index,token);
          if(retryIOSSource(index,token))return;
          fallbackToNextLine(
            index,
            'This line stopped advancing',
            token,
            'stall_timeout'
          );
          return;
        }
        progressTimer=setTimeout(check,2000);
      };
      progressTimer=setTimeout(check,2500);
    }

    function armStallWatchdog(){
      const token=playbackToken, index=currentSourceIndex;
      if(!isCurrentPlayback(token) || playbackStartedToken!==token ||
          awaitingPlayToken===token || stallTimer!==null || video.paused)return;
      const stalledAt=Number(video.currentTime);
      stallTimer=setTimeout(()=>{
        stallTimer=null;
        if(isCurrentPlayback(token) && !video.paused){
          if(document.hidden || video.seeking ||
              Number(video.currentTime)>stalledAt+0.05)return;
          if(retryIOSSource(index,token))return;
          fallbackToNextLine(index,'This line stopped responding',token,'stall_timeout');
        }
      },stallTimeoutMs);
    }

    function safeErrorDetails(error){
      const details={};
      for(const [key,value] of [
        ['error_code',error&&error.code],
        ['error_category',error&&error.category]
      ]){
        if(typeof value==='number' && Number.isInteger(value) && value>=0 && value<1000000){
          details[key]=value;
        }
      }
      return details;
    }

    function playbackFailure(error,index,token){
      const drmError=error && error.category===6;
      return fallbackToNextLine(
        index,
        drmError?'This line needs a compatible DRM player':'This line could not be played in this browser',
        token,
        drmError?'drm_error':'playback_error',
        safeErrorDetails(error)
      );
    }

    function showPlayPrompt(index,token){
      clearPlaybackWatchdogs();
      awaitingPlayToken=token;
      showMessage('Tap Play to start this line. ');
      const button=document.createElement('button');
      button.type='button';button.className='football-control';
      button.textContent='Play';
      button.addEventListener('click',()=>{
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        awaitingPlayToken=-1;
        playbackAttemptStartedAt=playbackClock();
        beginBuffering(index,token);
        armStartupWatchdog(index,token);
        requestVideoPlay(index,token);
      });
      messageEl.appendChild(button);
      revealControls();
    }

    async function requestVideoPlay(index,token){
      try{
        // Call play before awaiting so an explicit tap retains user activation.
        await video.play();
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        showMessage('');
      }catch(error){
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        if(error && error.name==='NotAllowedError'){
          showPlayPrompt(index,token);
          capturePlayerEvent('playback needs user interaction',{
            selected_index:index,
            stream_type:sourceType(sources[index]||{})
          });
          return;
        }
        // A source change can abort play without indicating a broken stream.
        if(error && error.name==='AbortError')return;
        await playbackFailure(error,index,token);
      }
    }

    function isIOS(){
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    }

    function hasWebKitStreamingEngine(){
      return !!(window.ManagedMediaSource || window.MediaSource);
    }

    function sourceSupport(source){
      const type=sourceType(source);
      const keyId=String(source.keyId||source.key_id||'').trim();
      const keyData=String(source.keyData||source.key_data||'').trim();

      if(isIOS() && type==='dash'){
        if(!hasWebKitStreamingEngine()){
          return {
            ok:false,
            reason:'DASH needs modern iOS WebKit (iOS 17.1+) or an HLS/FLV backup'
          };
        }
        if(keyId&&keyData && !(window.crypto&&window.crypto.subtle)){
          return {
            ok:false,
            reason:'ClearKey needs HTTPS and WebCrypto in this browser'
          };
        }
        return {
          ok:true,
          reason:keyId&&keyData
            ? 'DASH • ClearKey via WebCrypto'
            : 'DASH • browser compatibility will be checked by the player'
        };
      }

      if(isIOS() && type==='flv'){
        if(!hasWebKitStreamingEngine()){
          return {
            ok:false,
            reason:'FLV needs iOS 17.1+ ManagedMediaSource'
          };
        }
        return {
          ok:true,
          reason:'FLV • iPhone Web compatible'
        };
      }

      if(type==='flv' && window.mpegts && typeof mpegts.isSupported==='function'){
        if(!mpegts.isSupported()){
          return {ok:true, reason:'Browser support may be limited'};
        }
      }

      return {ok:true, reason:''};
    }

    async function fallbackToNextLine(failedIndex,message,token,reason='line_unavailable',details={}){
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      fallbackScheduledToken=token;
      clearPlaybackWatchdogs();
      try{video.pause()}catch(_){}
      autoFallbackTried.add(failedIndex);
      const failed=sources[failedIndex]||{};
      capturePlayerEvent('playback line failed',{
        selected_index:failedIndex,
        line_count:sources.length,
        stream_type:sourceType(failed),
        reason,
        ...details
      });

      let candidates=[...sources.keys()]
        .filter(i=>!autoFallbackTried.has(i))
        .filter(i=>sourceSupport(sources[i]).ok);
      if(isIOS()){
        const rank=(i)=>{
          const source=sources[i]||{};
          const type=sourceType(source);
          const hasKey=
            String(source.keyId||source.key_id||'').trim() &&
            String(source.keyData||source.key_data||'').trim();
          if(type==='hls')return 0;
          if(type==='flv')return 1;
          if(type==='mp4')return 2;
          if(type==='dash'&&!hasKey)return 3;
          if(type==='auto')return 4;
          return 9;
        };
        candidates.sort((a,b)=>rank(a)-rank(b));
      }

      if(candidates.length){
        const nextIndex=candidates[0];
        capturePlayerEvent('playback auto fallback',{
          from_index:failedIndex,
          to_index:nextIndex,
          line_count:sources.length
        });
        showMessage((message||'Line unavailable')+' • trying backup line…');
        fallbackTimer=setTimeout(()=>{
          fallbackTimer=null;
          if(isCurrentPlayback(token) && fallbackScheduledToken===token){
            loadSource(nextIndex,false);
          }
        },450);
        return;
      }

      // A timeout can also be a proxy/origin or manifest problem. Do not
      // diagnose the failure as 'HLS required' from the source format alone.
      showMessage((message||'No working line')+
        ' • No other working line is available. Check the source or try again later.');
    }

    function safeLineLabel(source,index){
      const fallback='Server '+(index+1);
      const raw=String(source&&source.label||'').trim();
      if(!raw || raw.length>72)return fallback;
      // Labels are presentation-only. Never let a URL, hostname, header or
      // credential-shaped value become visible in the compact player UI.
      if(/[\/:?=&@\\]/.test(raw) ||
          /(?:^|\s)(?:[a-z0-9-]+\.)+[a-z]{2,}(?:\s|$)/i.test(raw) ||
          /\b(?:referer|origin|authorization|token|key|kid)\s*[:=]/i.test(raw) ||
          /\b[0-9a-f]{24,}\b/i.test(raw))return fallback;
      // Remove only repeated provider words in the visible label.
      return raw.replace(/^\s*([^·•|]+?)\s*[·•|]\s*\1(?=\s*[·•|]|$)/i,'$1').trim();
    }

    function safeLineResolution(source){
      const raw=String(source&&source.resolution||'').trim();
      return /^(?:\d{3,4}p|auto|sd|hd|fhd|uhd|4k)$/i.test(raw)?raw:'';
    }

    function visibleLineEntries(){
      return sources.flatMap((source,index)=>

    function displayLineIndex(){
      const current=sources[currentSourceIndex]||{};
      if(current.transport!=='vercel-fallback')return currentSourceIndex;
      const originalId=String(current.id||'').replace(/-vpn-free$/,'');
      const primary=sources.findIndex(v=>v.transport!=='vercel-fallback'&&String(v.id||'')===originalId);
      return primary>=0?primary:currentSourceIndex;
    }

    function formatPlaybackTime(seconds){
      const n=Math.max(0,Math.floor(Number(seconds)||0));
      return n>=3600?Math.floor(n/3600)+':'+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0'):
        Math.floor(n/60)+':'+String(n%60).padStart(2,'0');
    }
    function updatePlaybackControls(){
      const d=Number(video.duration),at=Number(video.currentTime)||0,finite=Number.isFinite(d)&&d>0;
      timeLabel.textContent=finite?formatPlaybackTime(at)+' / '+formatPlaybackTime(d):'● LIVE';
      progressInput.disabled=!finite;
      progressInput.value=finite?String(Math.min(1000,Math.round(at/d*1000))):'0';
      playPauseButton.textContent=video.paused?'▶':'Ⅱ';
      playPauseButton.setAttribute('aria-label',video.paused?'Play':'Pause');
    }
    document.getElementById('nca-skip-back').addEventListener('click',()=>{
      try{video.currentTime=Math.max(0,(Number(video.currentTime)||0)-5)}catch(_){}
      updatePlaybackControls();revealControls();
    });
    document.getElementById('nca-skip-next').addEventListener('click',()=>{
      const at=Number(video.currentTime)||0,d=Number(video.duration);
      try{video.currentTime=Number.isFinite(d)&&d>0?Math.min(d,at+15):at+15}catch(_){}
      updatePlaybackControls();revealControls();
    });
    playPauseButton.addEventListener('click',()=>{
      if(video.paused)Promise.resolve(video.play()).catch(()=>{});else video.pause();
      updatePlaybackControls();revealControls();
    });
    progressInput.addEventListener('change',()=>{
      const d=Number(video.duration);
      if(Number.isFinite(d)&&d>0)try{video.currentTime=d*Number(progressInput.value)/1000}catch(_){}
      updatePlaybackControls();revealControls();
    });
    ['timeupdate','durationchange','loadedmetadata','playing','play','pause']
      .forEach(type=>video.addEventListener(type,updatePlaybackControls));

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function destroyPlayback(){
      const previousShaka=shakaPlayer, previousMpegts=mpegtsPlayer;
      shakaPlayer=null;mpegtsPlayer=null;
      if(activePlayingHandler){video.removeEventListener('playing',activePlayingHandler);activePlayingHandler=null}
      showMessage(''); currentTracks=[];
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
      try{video.pause()}catch(_){}
      video.onerror=null;
      try{video.removeAttribute('src');video.load()}catch(_){}
      if(previousMpegts){
        try{previousMpegts.pause()}catch(_){}
        try{previousMpegts.unload()}catch(_){}
        try{previousMpegts.detachMediaElement()}catch(_){}
        try{previousMpegts.destroy()}catch(_){}
      }
      // Complete earlier teardown before another player attaches to this video.
      playbackTeardown=playbackTeardown.catch(()=>{}).then(async()=>{
        if(previousShaka){try{await previousShaka.destroy()}catch(_){}}
      });
      await playbackTeardown;
    }

    function sourceType(source){
      const declared=String(source.streamType||source.stream_type||'auto').toLowerCase();
      if(declared==='m3u8')return 'hls';
      if(declared==='mpd')return 'dash';
      if(['hls','dash','mp4','flv'].includes(declared))return declared;
      const u=String(source.url||'').toLowerCase();
      if(u.includes('.m3u8'))return 'hls';
      if(u.includes('.mpd'))return 'dash';
      if(u.includes('.flv'))return 'flv';
      if(u.includes('.mp4'))return 'mp4';
      return 'auto';
    }

    function updateServerButton(index){
      const primaryIndex=displayLineIndex(),source=sources[primaryIndex]||sources[index]||{};
      serverButton.textContent=safeLineLabel(source,primaryIndex);
      renderLineRail();

    function fillQualityOptions(){
      const unique=new Map();
      currentTracks.forEach(track=>{
        const h=track.height||0, bw=track.bandwidth||0;
        if(h>0){
          const key=String(track.width||0)+'x'+h+'@'+bw, old=unique.get(key);
          if(!old||bw>(old.bandwidth||0)) unique.set(key,track);
        }
      });
      currentTracks=[...unique.values()]
        .sort((a,b)=>(b.height||0)-(a.height||0));
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
    }

    async function loadSource(index,userSelected=false){
      if(!sources.length){showMessage('No stream source.');return}
      if(userSelected){autoFallbackTried.clear();iosRecoveryAttempts.delete(index)}
      index=Math.max(0,Math.min(Number(index)||0,sources.length-1));
      const source=sources[index], url=String(source.url||'').trim(), type=sourceType(source);
      const support=sourceSupport(source);
      let engineReadyMs=0;

      currentSourceIndex=index;
      updateServerButton(index);
      closePlayerMenu();
      const token=++playbackToken;
      playbackAttemptStartedAt=playbackClock();activeBuffering=null;
      cancelPlaybackTimers();awaitingPlayToken=-1;
      armStartupWatchdog(index,token);
      await destroyPlayback();
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      beginBuffering(index,token);
      const onPlaying=()=>{
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        clearPlaybackWatchdogs();awaitingPlayToken=-1;showMessage('');
        lastPlaybackTime=Number(video.currentTime);
        armProgressWatchdog(index,token);
        finishBuffering(index,token);
        if(playbackStartedToken===token)return;
        playbackStartedToken=token;
        capturePlayerEvent('playback started',{
          selected_index:index,
          line_count:sources.length,
          stream_type:type,
          startup_ms:Math.max(0,Math.round(playbackClock()-playbackAttemptStartedAt)),
          engine_ready_ms:engineReadyMs,
          resolution:/^(\d{3,4}p|auto|hd|sd|fhd|uhd|4k)$/i.test(String(source.resolution||''))
            ? String(source.resolution).toLowerCase() : 'unknown',
          health_status:['healthy','unknown','slow','failed'].includes(source.healthStatus||source.health_status)
            ? (source.healthStatus||source.health_status) : 'unknown'
        });
      };
      activePlayingHandler=onPlaying;
      video.addEventListener('playing',onPlaying);
      if(!url){await fallbackToNextLine(index,'This line has no stream URL',token,'empty_source');return}
      if(!support.ok){
        await fallbackToNextLine(index,support.reason,token,'unsupported_browser');
        return;
      }
      try{
        const engineStartedAt=playbackClock();
        await ensurePlayerEngine(type,url);
        engineReadyMs=Math.max(0,Math.round(playbackClock()-engineStartedAt));
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        if(type==='flv'){
          if(!window.mpegts||!mpegts.isSupported())throw new Error('FLV is not supported by this browser.');
          mpegtsPlayer=mpegts.createPlayer(
            {type:'flv',isLive:true,url},
            {
              enableWorker:true,
              enableWorkerForMSE:isIOS(),
              enableStashBuffer:true,
              stashInitialSize:384*1024,
              isLive:true,
              liveBufferLatencyChasing:false,
              liveSync:false,
              lazyLoad:false,
              autoCleanupSourceBuffer:true,
              autoCleanupMaxBackwardDuration:30,
              autoCleanupMinBackwardDuration:10
            }
          );
          mpegtsPlayer.on(mpegts.Events.ERROR,()=>{
            if(retryIOSSource(index,token))return;
            fallbackToNextLine(index,'FLV line stopped responding',token,'flv_error');
          });
          mpegtsPlayer.attachMediaElement(video);
          mpegtsPlayer.load();
          video.defaultPlaybackRate=1;
          video.playbackRate=1;
          await requestVideoPlay(index,token);return;
        }
        if((type==='hls'||url.includes('.m3u8')) &&
            isIOS() &&
            video.canPlayType('application/vnd.apple.mpegurl')){
          video.onerror=()=>{
            if(retryIOSSource(index,token))return;
            fallbackToNextLine(
              index,
              'HLS line failed in this browser',
              token,
              'native_hls_error',
              safeErrorDetails(video.error)
            );
          };
          video.defaultPlaybackRate=1;
          video.playbackRate=1;
          video.src=url;
          video.load();
          await requestVideoPlay(index,token);
          return;
        }
        if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
          if(!window.shaka)throw new Error('Web streaming engine did not load.');
          shaka.polyfill.installAll();
          if(!shaka.Player.isBrowserSupported())throw new Error('This browser does not support DASH/HLS through the web player.');
          const player=new shaka.Player();
          shakaPlayer=player;
          await player.attach(video);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          const iosDash=isIOS() && type==='dash';
          const shakaConfig={
            // Begin on a modest rendition on mobile links. ABR can raise
            // quality after measuring real segment throughput; Auto stays on.
            abr:{enabled:true, defaultBandwidthEstimate:800000},
            manifest:{
              retryParameters:{
                maxAttempts:5,
                baseDelay:iosDash?250:300,
                backoffFactor:1.45,
                fuzzFactor:.2,
                timeout:8000
              },
              dash:{
                autoCorrectDrift:true
              }
            },
            streaming:{
              // Mobile Safari should start quickly and keep a modest buffer.
              // The previous 36s/8s iOS goals delayed recovery and could make
              // VPN jitter look like slow-motion playback.
              rebufferingGoal:2,
              bufferingGoal:12,
              bufferBehind:iosDash?8:10,
              segmentPrefetchLimit:iosDash?2:1,
              updateIntervalSeconds:1,
              safeSeekEndOffset:iosDash?3:0,
              stallEnabled:true,
              stallThreshold:iosDash?2:1,
              stallSkip:.1,
              allowMediaSourceRecoveries:true,
              minTimeBetweenRecoveries:iosDash?2:5,
              retryParameters:{
                maxAttempts:5,
                baseDelay:iosDash?250:300,
                backoffFactor:1.45,
                fuzzFactor:.2,
                timeout:8000
              }
            }
          };
          if(iosDash){
            // A 2s MPD live delay leaves too little data ahead of Safari's
            // playhead when a segment or its WebCrypto decryption is delayed.
            shakaConfig.manifest.defaultPresentationDelay=20;
            shakaConfig.manifest.dash.ignoreSuggestedPresentationDelay=true;
            shakaConfig.streaming.rebufferingGoal=4;
            shakaConfig.streaming.bufferingGoal=20;
            shakaConfig.streaming.segmentPrefetchLimit=3;
            shakaConfig.abr={
              enabled:true,
              useNetworkInformation:false,
              defaultBandwidthEstimate:900000,
              switchInterval:6,
              restrictions:{maxHeight:720}
            };
          }
          player.configure(shakaConfig);
          const rawKeyId=String(source.keyId||source.key_id||'').trim();
          const rawKeyData=String(source.keyData||source.key_data||'').trim();
          const keyId=rawKeyId.replace(/[^0-9a-f]/gi,'').toLowerCase();
          const keyData=rawKeyData.replace(/[^0-9a-f]/gi,'').toLowerCase();
          if(keyId&&keyData){
            if(keyId.length!==32||keyData.length!==32){
              throw new Error('Invalid ClearKey format.');
            }
            const clearKeys={};clearKeys[keyId]=keyData;
            const drmConfig={clearKeys};
            if(iosDash){
              const toBase64=hex=>btoa(hex.match(/../g)
                .map(byte=>String.fromCharCode(parseInt(byte,16))).join(''))
                .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
              const softwareKeyId=toBase64(keyId),softwareKeyData=toBase64(keyData);
              // Shaka 5.2 rebuilds DrmInfo on live MPD updates without keeping
              // its WebCrypto key map. A reused license session does not fill
              // it again, so restore the supplied key after each MPD update.
              const retainSoftwareKey=()=>{
                if(!isCurrentPlayback(token))return;
                const drmInfo=player.drmInfo();
                if(drmInfo && drmInfo.keySystem==='org.w3.clearkey'){
                  if(!drmInfo.clearKeys)drmInfo.clearKeys=new Map();
                  drmInfo.clearKeys.set(softwareKeyId,softwareKeyData);
                }
              };
              player.addEventListener('manifestupdated',retainSoftwareKey);
              player.addEventListener('drmsessionupdate',retainSoftwareKey);
            }
            if(!isIOS()) drmConfig.preferredKeySystems=['org.w3.clearkey'];
            player.configure({drm:drmConfig});
          }
          player.addEventListener('error',event=>{
            if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
            const detail=event&&event.detail?event.detail:{};
            const recoverable=
              detail.handled===true ||
              detail.severity===1 ||
              (window.shaka &&
               shaka.util &&
               shaka.util.Error &&
               shaka.util.Error.Severity &&
               detail.severity===shaka.util.Error.Severity.RECOVERABLE);
            if(recoverable){
              // A recovered manifest/network warning is not necessarily a
              // playback stall. Count buffering only while media is missing.
              if(video.readyState<3 && !video.paused)beginBuffering(index,token);
              armStallWatchdog();
              return;
            }
            playbackFailure(detail,index,token);
          });
          const manifestMime=type==='dash'?'application/dash+xml':'application/vnd.apple.mpegurl';
          await player.load(url,undefined,manifestMime);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          currentTracks=player.getVariantTracks(); fillQualityOptions();
          await requestVideoPlay(index,token);return;
        }
        video.src=url;
        video.onerror=()=>fallbackToNextLine(index,'Browser video playback failed',token,'native_video_error',safeErrorDetails(video.error));
        await requestVideoPlay(index,token);
      }catch(error){
        await playbackFailure(error,index,token);
      }
    }

    serverButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openLineMenu();
      else closePlayerMenu();
    });
    qualityButton.addEventListener('click',event=>{
      event.stopPropagation();
      if(menuPanel.classList.contains('hidden')) openQualityMenu();
      else closePlayerMenu();
    });
    closeButton.addEventListener('click',async()=>{
      capturePlayerEvent('playback closed',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
      ++playbackToken;cancelPlaybackTimers();awaitingPlayToken=-1;activeBuffering=null;currentSessionId='';
      if(controlsTimer)clearTimeout(controlsTimer);
      try{
        if(video.webkitDisplayingFullscreen && video.webkitExitFullscreen){
          video.webkitExitFullscreen();
        }
      }catch(_){}
      try{
        if(document.fullscreenElement && document.exitFullscreen){
          await document.exitFullscreen();
        }
      }catch(_){}
      if(typeof screen!=='undefined' &&
          screen.orientation &&
          typeof screen.orientation.unlock==='function'){
        try{screen.orientation.unlock()}catch(_){}
      }
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden','true');
      await destroyPlayback();
    });
    overlay.addEventListener('pointermove',()=>{
      // Desktop: moving the cursor over controls refreshes their idle timer.
      if(overlay.classList.contains('open')&&!isIOS())revealControls();
    });
    overlay.addEventListener('pointerup',event=>{
      if(event.target===video||event.target===videoWrap||event.target===videoFrame){
        closePlayerMenu();
        revealControls();
      }
    });
    function applyDisplayMode(mode){
      displayMode=['fit','full','zoom'].includes(mode)?mode:'fit';
      video.classList.remove('mode-fit','mode-full','mode-zoom');
      video.classList.add('mode-'+displayMode);
      fitButton.textContent=displayMode==='fit'?'Fit':displayMode==='full'?'Full':'Zoom';
      layoutVideoFrame();
    }
    fitButton.addEventListener('click',()=>{
      applyDisplayMode(displayMode==='fit'?'full':displayMode==='full'?'zoom':'fit');
    });
    function clearManualRotation(){
      manualRotation=0;

      // Manual iOS fallback rotates the whole player canvas, not only the
      // <video>. Reset every temporary viewport override here.
      overlay.style.inset='';
      overlay.style.top='';
      overlay.style.left='';
      overlay.style.right='';
      overlay.style.bottom='';
      overlay.style.width='';
      overlay.style.height='';
      overlay.style.transform='';
      overlay.style.transformOrigin='';

      video.style.transform='';
      video.style.width='100%';
      video.style.height='100%';
      rotateButton.setAttribute('aria-label','Rotate video');
    }

    function applyManualRotation(){
      const angle=((manualRotation%360)+360)%360;

      // iPhone Safari usually cannot lock screen.orientation. Rotating only
      // the <video> leaves the toolbar & player canvas in portrait, producing
      // a sideways oversized image. Rotate the complete overlay and swap its
      // viewport dimensions instead.
      video.style.transform='';
      video.style.width='100%';
      video.style.height='100%';

      if(!angle){
        overlay.style.inset='';
        overlay.style.top='';
        overlay.style.left='';
        overlay.style.right='';
        overlay.style.bottom='';
        overlay.style.width='';
        overlay.style.height='';
        overlay.style.transform='';
        overlay.style.transformOrigin='';
      }else{
        const viewport=window.visualViewport;
        const w=Math.max(
          1,
          Math.round(viewport?.width||document.documentElement.clientWidth||window.innerWidth||1)
        );
        const h=Math.max(
          1,
          Math.round(viewport?.height||document.documentElement.clientHeight||window.innerHeight||1)
        );
        const quarterTurn=angle===90||angle===270;

        overlay.style.inset='auto';
        overlay.style.top='50%';
        overlay.style.left='50%';
        overlay.style.right='auto';
        overlay.style.bottom='auto';
        overlay.style.width=(quarterTurn?h:w)+'px';
        overlay.style.height=(quarterTurn?w:h)+'px';
        overlay.style.transformOrigin='center center';
        overlay.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';
      }

      rotateButton.setAttribute('aria-label',angle?'Rotate video ('+angle+'°)':'Rotate video');
    }

    async function rotatePlayer(){
      revealControls();
      try{
        const orientation=
          typeof screen!=='undefined' ? screen.orientation : null;
        if(orientation && typeof orientation.lock==='function'){
          if(!document.fullscreenElement && overlay.requestFullscreen){
            await overlay.requestFullscreen();
          }
          const landscape=String(orientation.type||'').startsWith('landscape');
          await orientation.lock(landscape?'portrait-primary':'landscape');
          clearManualRotation();
          return;
        }
      }catch(_){}

      manualRotation=(manualRotation+90)%360;
      applyManualRotation();
    }

    rotateButton.addEventListener('click',rotatePlayer);
    fullscreenButton.addEventListener('click',async()=>{
      try{
        if(isIOS()){
          // iPhone Safari cannot fullscreen the custom player container.
          // Enter native <video> fullscreen so Safari's address bar and
          // bottom browser toolbar are actually removed.
          if(video.webkitDisplayingFullscreen &&
              typeof video.webkitExitFullscreen==='function'){
            video.webkitExitFullscreen();
            return;
          }

          const enterNativeFullscreen=
            video.webkitEnterFullscreen||video.webkitEnterFullScreen;
          if(typeof enterNativeFullscreen==='function'){
            clearManualRotation();
            enterNativeFullscreen.call(video);
            return;
          }
        }

        // Other browsers can fullscreen the whole NCA player so custom line
        // and quality controls remain available.
        if(!document.fullscreenElement){
          if(overlay.requestFullscreen)await overlay.requestFullscreen();
        }else if(document.exitFullscreen){
          await document.exitFullscreen();
        }
      }catch(_){}
      revealControls();
    });
    // Forward the tap synchronously to preserve iOS's fullscreen user gesture.
    iosFullscreenButton.addEventListener('click',()=>fullscreenButton.click());

    video.addEventListener('webkitbeginfullscreen',()=>{
      fullscreenButton.textContent='Exit';
      iosFullscreenButton.setAttribute('aria-label','Exit fullscreen');
    });
    video.addEventListener('webkitendfullscreen',()=>{
      fullscreenButton.textContent='Fullscreen';
      iosFullscreenButton.setAttribute('aria-label','Enter fullscreen');
      layoutVideoFrame();
      revealControls();
    });
    document.addEventListener('fullscreenchange',()=>{
      fullscreenButton.textContent=document.fullscreenElement?'Exit':'Fullscreen';
      if(!document.fullscreenElement &&
          typeof screen!=='undefined' &&
          screen.orientation &&
          typeof screen.orientation.unlock==='function'){
        try{screen.orientation.unlock()}catch(_){}
      }
      if(manualRotation)applyManualRotation();
      layoutVideoFrame();
      if(overlay.classList.contains('open')) revealControls();
    });
    if(typeof screen!=='undefined' && screen.orientation){
      screen.orientation.addEventListener?.('change',()=>{
        if(manualRotation)applyManualRotation();
        layoutVideoFrame();
        if(overlay.classList.contains('open')) revealControls();
      });
    }
    window.addEventListener?.('resize',()=>{
      if(manualRotation)applyManualRotation();
      layoutVideoFrame();
    });
    video.addEventListener('loadedmetadata',layoutVideoFrame);
    video.addEventListener('resize',layoutVideoFrame);
    if(typeof window.ResizeObserver==='function'){
      new window.ResizeObserver(layoutVideoFrame).observe(videoWrap);
    }
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&overlay.classList.contains('open')&&!document.fullscreenElement)closeButton.click()});
    function normalizeIOSPlaybackRate(){
      if(!isIOS())return;
      // Shaka holds playback at zero while buffering. Forcing it back to one
      // makes its rate controller set zero again, creating an event loop that
      // can freeze or reload the iPhone tab before the MPD starts playing.
      if(video.playbackRate===0)return;
      if(!Number.isFinite(video.playbackRate) || Math.abs(video.playbackRate-1)>0.005){
        video.defaultPlaybackRate=1;
        video.playbackRate=1;
      }
    }
    video.addEventListener('ratechange',normalizeIOSPlaybackRate);
    video.addEventListener('playing',normalizeIOSPlaybackRate);
    video.addEventListener('loadedmetadata',normalizeIOSPlaybackRate);

    video.addEventListener('waiting',()=>{
      if(!overlay.classList.contains('open'))return;
      armStallWatchdog();
      beginBuffering(currentSourceIndex,playbackToken);
    });
    video.addEventListener('stalled',armStallWatchdog);
    video.addEventListener('timeupdate',()=>{
      if(!isCurrentPlayback(playbackToken) ||
          playbackStartedToken!==playbackToken || video.paused)return;
      const now=Number(video.currentTime);
      if(now>lastPlaybackTime+0.05){
        finishBuffering(currentSourceIndex,playbackToken);
        if(stallTimer!==null){clearTimeout(stallTimer);stallTimer=null}
      }
      lastPlaybackTime=now;
    });
    video.addEventListener('pause',()=>{
      activeBuffering=null;
      if(stallTimer!==null)clearTimeout(stallTimer);
      stallTimer=null;
      clearProgressWatchdog();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)activeBuffering=null;
    });
    video.addEventListener('ended',()=>{
      if(!isCurrentPlayback(playbackToken))return;
      capturePlayerEvent('playback ended',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
      if(isIOSRecoverableSource(currentSourceIndex)){
        const token=playbackToken,index=currentSourceIndex;
        if(retryIOSSource(index,token))return;
        fallbackToNextLine(index,'Live stream ended',token,'stream_ended');
      }
    });

    window.updateFootballPlayerSources=(sourcesJson,sessionId)=>{
      if(!currentSessionId||String(sessionId||'')!==currentSessionId||
          !overlay.classList.contains('open'))return;
      let incoming;
      try{incoming=JSON.parse(String(sourcesJson||'[]'))}catch(_){return}
      if(!Array.isArray(incoming)||incoming.length<=sources.length)return;
      // Existing indices identify the selected line and all recovery timers.
      // Only matching prefixes may add backups; never replace active media.
      for(let i=0;i<sources.length;i++){
        const old=sources[i],next=incoming[i];
        if(!next||!next.url)return;
        if(old.id&&next.id ? String(old.id)!==String(next.id) : old.url!==next.url)return;
      }
      const extra=incoming.slice(sources.length);
      if(extra.some(source=>!source||!source.url))return;
      sources.push(...extra);
      updateServerButton(currentSourceIndex);
      if(!menuPanel.classList.contains('hidden')&&menuTitle.textContent==='Choose line')openLineMenu();
    };

    window.prewarmFootballPlayer=(sourcesJson)=>{
      let incoming=[];
      try{
        const parsed=JSON.parse(String(sourcesJson||'[]'));
        if(Array.isArray(parsed))incoming=parsed.filter(source=>source&&source.url);
      }catch(_){return}
      const candidate=incoming.find(source=>{
        const type=sourceType(source);
        return type==='hls'||type==='dash'||type==='flv';
      });
      if(!candidate)return;
      // Load only the decoder script. No manifest, media URL, headers or key
      // material is requested until the user actually opens a line.
      ensurePlayerEngine(sourceType(candidate),String(candidate.url||''))
        .catch(()=>{});
    };

    window.openFootballPlayer=async(sourcesJson,selectedIndex,title,matchId,sessionId)=>{
      try{const parsed=JSON.parse(String(sourcesJson||'[]'));sources=Array.isArray(parsed)?parsed.filter(x=>x&&x.url):[]}catch(_){sources=[]}
      autoFallbackTried.clear();
      iosRecoveryAttempts.clear();
      const safeMatchId=String(matchId||'').trim();
      currentMatchId=/^[A-Za-z0-9_:-]{1,128}$/.test(safeMatchId)?safeMatchId:'';
      currentSessionId=String(sessionId||'');
      titleEl.textContent=String(title||'NCA');
      let startIndex=Math.max(0,Math.min(Number(selectedIndex)||0,sources.length-1));
      if(isIOS() && sources[startIndex]){
        const iosRank=(source)=>{
          const type=sourceType(source);
          const hasKey=
            String(source.keyId||source.key_id||'').trim() &&
            String(source.keyData||source.key_data||'').trim();
          if(!sourceSupport(source).ok)return 99;
          if(type==='hls')return 0;
          if(type==='flv')return 1;
          if(type==='mp4')return 2;
          if(type==='dash'&&!hasKey)return 3;
          if(type==='auto')return 4;
          return 9;
        };
        if(iosRank(sources[startIndex])>=90){
          let best=-1,bestRank=100;
          sources.forEach((source,i)=>{
            const rank=iosRank(source);
            if(rank<bestRank){best=i;bestRank=rank}
          });
          if(best>=0) startIndex=best;
        }
      }
      currentSourceIndex=startIndex;
      video.controls=isIOS();
      updatePlaybackControls();
      updateServerButton(startIndex);
      applyDisplayMode('fit');
      clearManualRotation();
      syncIOSSystemRotationControls();
      overlay.classList.toggle('channel-player',sources[startIndex]?.portraitStart===true);
      overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      layoutVideoFrame();
      revealControls();
      await loadSource(startIndex);
    };
  })();
  </script>
</body>
</html>
