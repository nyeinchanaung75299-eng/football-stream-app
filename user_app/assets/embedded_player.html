    function playbackClock(){

        ? window.performance.now() : Date.now();

    function playbackProperties(index=currentSourceIndex){
      const source=sources[index]||{};

    function capturePlayerEvent(name,properties={}){

    function beginBuffering(index,token){

    function loadScriptOnce(src,key){
      if(window[key]) return Promise.resolve();
      if(scriptLoads.has(src)) return scriptLoads.get(src);

        if(!hasWebKitStreamingEngine()){
          return {
            ok:false,
            reason:'FLV needs iOS 17.1+ ManagedMediaSource'
          };
        }
        return {
          ok:true,
          reason:'FLV • iPhone Web compatible'
        };
      }

      if(type==='flv' && window.mpegts && typeof mpegts.isSupported==='function'){
        if(!mpegts.isSupported()){
          return {ok:true, reason:'Browser support may be limited'};
        }
      }

      return {ok:true, reason:''};
    }

    async function fallbackToNextLine(failedIndex,message,token,reason='line_unavailable',details={}){
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      fallbackScheduledToken=token;
      clearPlaybackWatchdogs();
      try{video.pause()}catch(_){}
      autoFallbackTried.add(failedIndex);
      const failed=sources[failedIndex]||{};
      capturePlayerEvent('playback line failed',{
        selected_index:failedIndex,
        line_count:sources.length,
        stream_type:sourceType(failed),
        reason,
        ...details
      });

      let candidates=[...sources.keys()]
        .filter(i=>!autoFallbackTried.has(i))
        .filter(i=>sourceSupport(sources[i]).ok);
      if(isIOS()){
        const rank=(i)=>{
          const source=sources[i]||{};
          const type=sourceType(source);
          const hasKey=
            String(source.keyId||source.key_id||'').trim() &&
            String(source.keyData||source.key_data||'').trim();
          if(type==='hls')return 0;
          if(type==='flv')return 1;
          if(type==='mp4')return 2;
          if(type==='dash'&&!hasKey)return 3;
          if(type==='auto')return 4;
          return 9;
        };
        candidates.sort((a,b)=>rank(a)-rank(b));
      }

      if(candidates.length){
        const nextIndex=candidates[0];
        capturePlayerEvent('playback auto fallback',{
          from_index:failedIndex,
          to_index:nextIndex,
          line_count:sources.length
        });
        showMessage((message||'Line unavailable')+' • trying backup line…');
        fallbackTimer=setTimeout(()=>{
          fallbackTimer=null;
          if(isCurrentPlayback(token) && fallbackScheduledToken===token){
            loadSource(nextIndex,false);
          }
        },450);
        return;
      }

      showMessage((message||'No working line')+(isIOS() && sourceType(failed)==='dash'
        ? ' • No working backup. A compatible HLS line is needed for this match.'
        : ' • Tap Line to choose again.'));
    }

    function escapeHtml(value){
      return String(value)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    async function destroyPlayback(){
      const previousShaka=shakaPlayer, previousMpegts=mpegtsPlayer;
      shakaPlayer=null;mpegtsPlayer=null;
      if(activePlayingHandler){video.removeEventListener('playing',activePlayingHandler);activePlayingHandler=null}
      showMessage(''); currentTracks=[];
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
      try{video.pause()}catch(_){}
      video.onerror=null;
      try{video.removeAttribute('src');video.load()}catch(_){}
      if(previousMpegts){
        try{previousMpegts.pause()}catch(_){}
        try{previousMpegts.unload()}catch(_){}
        try{previousMpegts.detachMediaElement()}catch(_){}
        try{previousMpegts.destroy()}catch(_){}
      }
      // Complete earlier teardown before another player attaches to this video.
      playbackTeardown=playbackTeardown.catch(()=>{}).then(async()=>{
        if(previousShaka){try{await previousShaka.destroy()}catch(_){}}
      });
      await playbackTeardown;
    }

    function sourceType(source){
      const declared=String(source.streamType||source.stream_type||'auto').toLowerCase();
      if(declared==='m3u8')return 'hls';
      if(declared==='mpd')return 'dash';
      if(['hls','dash','mp4','flv'].includes(declared))return declared;
      const u=String(source.url||'').toLowerCase();
      if(u.includes('.m3u8'))return 'hls';
      if(u.includes('.mpd'))return 'dash';
      if(u.includes('.flv'))return 'flv';
      if(u.includes('.mp4'))return 'mp4';
      return 'auto';
    }

    function updateServerButton(index){
      const source=sources[index]||{};
      serverButton.textContent=String(
        source.label||source.resolution||('Server '+(index+1))
      );
    }

    function fillQualityOptions(){
      const unique=new Map();
      currentTracks.forEach(track=>{
        const h=track.height||0, bw=track.bandwidth||0;
        if(h>0){
          const key=String(h), old=unique.get(key);
          if(!old||bw>(old.bandwidth||0)) unique.set(key,track);
        }
      });
      currentTracks=[...unique.values()]
        .sort((a,b)=>(b.height||0)-(a.height||0));
      qualityButton.textContent='Auto';
      qualityButton.dataset.mode='auto';
      qualityButton.dataset.trackId='';
    }

    async function loadSource(index,userSelected=false){
      if(!sources.length){showMessage('No stream source.');return}
      if(userSelected){autoFallbackTried.clear();iosRecoveryAttempts.delete(index)}
      index=Math.max(0,Math.min(Number(index)||0,sources.length-1));
      const source=sources[index], url=String(source.url||'').trim(), type=sourceType(source);
      const support=sourceSupport(source);

      currentSourceIndex=index;
      updateServerButton(index);
      closePlayerMenu();
      const token=++playbackToken;
      playbackAttemptStartedAt=playbackClock();activeBuffering=null;
      cancelPlaybackTimers();awaitingPlayToken=-1;
      armStartupWatchdog(index,token);
      await destroyPlayback();
      if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
      beginBuffering(index,token);
      const onPlaying=()=>{
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        clearPlaybackWatchdogs();awaitingPlayToken=-1;showMessage('');
        lastPlaybackTime=Number(video.currentTime);
        armProgressWatchdog(index,token);
        finishBuffering(index,token);
        if(playbackStartedToken===token)return;
        playbackStartedToken=token;
        capturePlayerEvent('playback started',{
          selected_index:index,
          line_count:sources.length,
          stream_type:type,
          startup_ms:Math.max(0,Math.round(playbackClock()-playbackAttemptStartedAt)),
          resolution:/^(\d{3,4}p|auto|hd|sd|fhd|uhd|4k)$/i.test(String(source.resolution||''))
            ? String(source.resolution).toLowerCase() : 'unknown',
          health_status:['healthy','unknown','slow','failed'].includes(source.healthStatus||source.health_status)
            ? (source.healthStatus||source.health_status) : 'unknown'
        });
      };
      activePlayingHandler=onPlaying;
      video.addEventListener('playing',onPlaying);
      if(!url){await fallbackToNextLine(index,'This line has no stream URL',token,'empty_source');return}
      if(!support.ok){
        await fallbackToNextLine(index,support.reason,token,'unsupported_browser');
        return;
      }
      try{
        await ensurePlayerEngine(type,url);
        if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
        if(type==='flv'){
          if(!window.mpegts||!mpegts.isSupported())throw new Error('FLV is not supported by this browser.');
          mpegtsPlayer=mpegts.createPlayer(
            {type:'flv',isLive:true,url},
            {
              enableWorker:true,
              enableWorkerForMSE:isIOS(),
              enableStashBuffer:true,
              stashInitialSize:384*1024,
              isLive:true,
              liveBufferLatencyChasing:false,
              liveSync:false,
              lazyLoad:false,
              autoCleanupSourceBuffer:true,
              autoCleanupMaxBackwardDuration:30,
              autoCleanupMinBackwardDuration:10
            }
          );
          mpegtsPlayer.on(mpegts.Events.ERROR,()=>{
            if(retryIOSSource(index,token))return;
            fallbackToNextLine(index,'FLV line stopped responding',token,'flv_error');
          });
          mpegtsPlayer.attachMediaElement(video);
          mpegtsPlayer.load();
          video.defaultPlaybackRate=1;
          video.playbackRate=1;
          await requestVideoPlay(index,token);return;
        }
        if((type==='hls'||url.includes('.m3u8')) &&
            isIOS() &&
            video.canPlayType('application/vnd.apple.mpegurl')){
          video.onerror=()=>{
            if(retryIOSSource(index,token))return;
            fallbackToNextLine(
              index,
              'HLS line failed in this browser',
              token,
              'native_hls_error',
              safeErrorDetails(video.error)
            );
          };
          video.defaultPlaybackRate=1;
          video.playbackRate=1;
          video.src=url;
          video.load();
          await requestVideoPlay(index,token);
          return;
        }
        if(type==='hls'||type==='dash'||url.includes('.m3u8')||url.includes('.mpd')){
          if(!window.shaka)throw new Error('Web streaming engine did not load.');
          shaka.polyfill.installAll();
          if(!shaka.Player.isBrowserSupported())throw new Error('This browser does not support DASH/HLS through the web player.');
          const player=new shaka.Player();
          shakaPlayer=player;
          await player.attach(video);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          const iosDash=isIOS() && type==='dash';
          const shakaConfig={
            manifest:{
              retryParameters:{
                maxAttempts:5,
                baseDelay:iosDash?250:300,
                backoffFactor:1.45,
                fuzzFactor:.2,
                timeout:8000
              },
              dash:{
                autoCorrectDrift:true
              }
            },
            streaming:{
              // Mobile Safari should start quickly and keep a modest buffer.
              // The previous 36s/8s iOS goals delayed recovery and could make
              // VPN jitter look like slow-motion playback.
              rebufferingGoal:2,
              bufferingGoal:12,
              bufferBehind:iosDash?8:10,
              segmentPrefetchLimit:iosDash?2:1,
              updateIntervalSeconds:1,
              safeSeekEndOffset:iosDash?3:0,
              stallEnabled:true,
              stallThreshold:iosDash?2:1,
              stallSkip:.1,
              allowMediaSourceRecoveries:true,
              minTimeBetweenRecoveries:iosDash?2:5,
              retryParameters:{
                maxAttempts:5,
                baseDelay:iosDash?250:300,
                backoffFactor:1.45,
                fuzzFactor:.2,
                timeout:8000
              }
            }
          };
          if(iosDash){
            // A 2s MPD live delay leaves too little data ahead of Safari's
            // playhead when a segment or its WebCrypto decryption is delayed.
            shakaConfig.manifest.defaultPresentationDelay=20;
            shakaConfig.manifest.dash.ignoreSuggestedPresentationDelay=true;
            shakaConfig.streaming.rebufferingGoal=4;
            shakaConfig.streaming.bufferingGoal=20;
            shakaConfig.streaming.segmentPrefetchLimit=3;
            shakaConfig.abr={
              enabled:true,
              useNetworkInformation:false,
              defaultBandwidthEstimate:900000,
              switchInterval:6,
              restrictions:{maxHeight:720}
            };
          }
          player.configure(shakaConfig);
          const rawKeyId=String(source.keyId||source.key_id||'').trim();
          const rawKeyData=String(source.keyData||source.key_data||'').trim();
          const keyId=rawKeyId.replace(/[^0-9a-f]/gi,'').toLowerCase();
          const keyData=rawKeyData.replace(/[^0-9a-f]/gi,'').toLowerCase();
          if(keyId&&keyData){
            if(keyId.length!==32||keyData.length!==32){
              throw new Error('Invalid ClearKey format.');
            }
            const clearKeys={};clearKeys[keyId]=keyData;
            const drmConfig={clearKeys};
            if(iosDash){
              const toBase64=hex=>btoa(hex.match(/../g)
                .map(byte=>String.fromCharCode(parseInt(byte,16))).join(''))
                .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
              const softwareKeyId=toBase64(keyId),softwareKeyData=toBase64(keyData);
              // Shaka 5.2 rebuilds DrmInfo on live MPD updates without keeping
              // its WebCrypto key map. A reused license session does not fill
              // it again, so restore the supplied key after each MPD update.
              const retainSoftwareKey=()=>{
                if(!isCurrentPlayback(token))return;
                const drmInfo=player.drmInfo();
                if(drmInfo && drmInfo.keySystem==='org.w3.clearkey'){
                  if(!drmInfo.clearKeys)drmInfo.clearKeys=new Map();
                  drmInfo.clearKeys.set(softwareKeyId,softwareKeyData);
                }
              };
              player.addEventListener('manifestupdated',retainSoftwareKey);
              player.addEventListener('drmsessionupdate',retainSoftwareKey);
            }
            if(!isIOS()) drmConfig.preferredKeySystems=['org.w3.clearkey'];
            player.configure({drm:drmConfig});
          }
          player.addEventListener('error',event=>{
            if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
            const detail=event&&event.detail?event.detail:{};
            const recoverable=
              detail.handled===true ||
              detail.severity===1 ||
              (window.shaka &&
               shaka.util &&
               shaka.util.Error &&
               shaka.util.Error.Severity &&
               detail.severity===shaka.util.Error.Severity.RECOVERABLE);
            if(recoverable){
              // A recovered manifest/network warning is not necessarily a
              // playback stall. Count buffering only while media is missing.
              if(video.readyState<3 && !video.paused)beginBuffering(index,token);
              armStallWatchdog();
              return;
            }
            playbackFailure(detail,index,token);
          });
          const manifestMime=type==='dash'?'application/dash+xml':'application/vnd.apple.mpegurl';
          await player.load(url,undefined,manifestMime);
          if(!isCurrentPlayback(token) || fallbackScheduledToken===token)return;
          currentTracks=player.getVariantTracks(); fillQualityOptions();
          await requestVideoPlay(index,token);return;
        }
        video.src=url;
        video.onerror=()=>fallbackToNextLine(index,'Browser video playback failed',token,'native_video_error',safeErrorDetails(video.error));
        await requestVideoPlay(index,token);
      }catch(error){
        await playbackFailure(error,index,token);
      }
    }

    function clearManualRotation(){
      manualRotation=0;

      // Manual iOS fallback rotates the whole player canvas, not only the
      // <video>. Reset every temporary viewport override here.
      overlay.style.inset='';
      overlay.style.top='';
      overlay.style.left='';
      overlay.style.right='';
      overlay.style.bottom='';
      overlay.style.width='';
      overlay.style.height='';
      overlay.style.transform='';
      overlay.style.transformOrigin='';

      video.style.transform='';
      video.style.width='100%';
      video.style.height='100%';
      rotateButton.textContent='↻ Rotate';
    }

    function applyManualRotation(){
      const angle=((manualRotation%360)+360)%360;

      // iPhone Safari usually cannot lock screen.orientation. Rotating only
      // the <video> leaves the toolbar & player canvas in portrait, producing
      // a sideways oversized image. Rotate the complete overlay and swap its
      // viewport dimensions instead.
      video.style.transform='';
      video.style.width='100%';
      video.style.height='100%';

      if(!angle){
        overlay.style.inset='';
        overlay.style.top='';
        overlay.style.left='';
        overlay.style.right='';
        overlay.style.bottom='';
        overlay.style.width='';
        overlay.style.height='';
        overlay.style.transform='';
        overlay.style.transformOrigin='';
      }else{
        const viewport=window.visualViewport;
        const w=Math.max(
          1,
          Math.round(viewport?.width||document.documentElement.clientWidth||window.innerWidth||1)
        );
        const h=Math.max(
          1,
          Math.round(viewport?.height||document.documentElement.clientHeight||window.innerHeight||1)
        );
        const quarterTurn=angle===90||angle===270;

        overlay.style.inset='auto';
        overlay.style.top='50%';
        overlay.style.left='50%';
        overlay.style.right='auto';
        overlay.style.bottom='auto';
        overlay.style.width=(quarterTurn?h:w)+'px';
        overlay.style.height=(quarterTurn?w:h)+'px';
        overlay.style.transformOrigin='center center';
        overlay.style.transform='translate(-50%,-50%) rotate('+angle+'deg)';
      }

      rotateButton.textContent=angle?'↻ '+angle+'°':'↻ Rotate';
    }

    async function rotatePlayer(){
      revealControls();
      try{
        const orientation=
          typeof screen!=='undefined' ? screen.orientation : null;
        if(orientation && typeof orientation.lock==='function'){
          if(!document.fullscreenElement && overlay.requestFullscreen){
            await overlay.requestFullscreen();
          }
          const landscape=String(orientation.type||'').startsWith('landscape');
          await orientation.lock(landscape?'portrait-primary':'landscape');
          clearManualRotation();
          return;
        }
      }catch(_){}

      manualRotation=(manualRotation+90)%360;
      applyManualRotation();
    }

    function normalizeIOSPlaybackRate(){
      if(!isIOS())return;
      // Shaka holds playback at zero while buffering. Forcing it back to one
      // makes its rate controller set zero again, creating an event loop that
      // can freeze or reload the iPhone tab before the MPD starts playing.
      if(video.playbackRate===0)return;
      if(!Number.isFinite(video.playbackRate) || Math.abs(video.playbackRate-1)>0.005){
        video.defaultPlaybackRate=1;
        video.playbackRate=1;
      }
    }
    video.addEventListener('ratechange',normalizeIOSPlaybackRate);
    video.addEventListener('playing',normalizeIOSPlaybackRate);
    video.addEventListener('loadedmetadata',normalizeIOSPlaybackRate);

    video.addEventListener('waiting',()=>{
      if(!overlay.classList.contains('open'))return;
      armStallWatchdog();
      beginBuffering(currentSourceIndex,playbackToken);
    });
    video.addEventListener('stalled',armStallWatchdog);
    video.addEventListener('timeupdate',()=>{
      if(!isCurrentPlayback(playbackToken) ||
          playbackStartedToken!==playbackToken || video.paused)return;
      const now=Number(video.currentTime);
      if(now>lastPlaybackTime+0.05){
        finishBuffering(currentSourceIndex,playbackToken);
        if(stallTimer!==null){clearTimeout(stallTimer);stallTimer=null}
      }
      lastPlaybackTime=now;
    });
    video.addEventListener('pause',()=>{
      activeBuffering=null;
      if(stallTimer!==null)clearTimeout(stallTimer);
      stallTimer=null;
      clearProgressWatchdog();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)activeBuffering=null;
    });
    video.addEventListener('ended',()=>{
      if(!isCurrentPlayback(playbackToken))return;
      capturePlayerEvent('playback ended',{
        selected_index:currentSourceIndex,
        line_count:sources.length
      });
      if(isIOSRecoverableSource(currentSourceIndex)){
        const token=playbackToken,index=currentSourceIndex;
        if(retryIOSSource(index,token))return;
        fallbackToNextLine(index,'Live stream ended',token,'stream_ended');
      }
    });

    window.updateFootballPlayerSources=(sourcesJson,sessionId)=>{
      if(!currentSessionId||String(sessionId||'')!==currentSessionId||
          !overlay.classList.contains('open'))return;
      let incoming;
      try{incoming=JSON.parse(String(sourcesJson||'[]'))}catch(_){return}
      if(!Array.isArray(incoming)||incoming.length<=sources.length)return;
      // Existing indices identify the selected line and all recovery timers.
      // Only matching prefixes may add backups; never replace active media.
      for(let i=0;i<sources.length;i++){
        const old=sources[i],next=incoming[i];
        if(!next||!next.url)return;
        if(old.id&&next.id ? String(old.id)!==String(next.id) : old.url!==next.url)return;
      }
      const extra=incoming.slice(sources.length);
      if(extra.some(source=>!source||!source.url))return;
      sources.push(...extra);
      updateServerButton(currentSourceIndex);
      if(!menuPanel.classList.contains('hidden')&&menuTitle.textContent==='Choose line')openLineMenu();
    };

    window.openFootballPlayer=async(sourcesJson,selectedIndex,title,matchId,sessionId)=>{
      try{const parsed=JSON.parse(String(sourcesJson||'[]'));sources=Array.isArray(parsed)?parsed.filter(x=>x&&x.url):[]}catch(_){sources=[]}
      autoFallbackTried.clear();
      iosRecoveryAttempts.clear();
      const safeMatchId=String(matchId||'').trim();
      currentMatchId=/^[A-Za-z0-9_:-]{1,128}$/.test(safeMatchId)?safeMatchId:'';
      currentSessionId=String(sessionId||'');
      titleEl.textContent=String(title||'NCA');
      let startIndex=Math.max(0,Math.min(Number(selectedIndex)||0,sources.length-1));
      if(isIOS() && sources[startIndex]){
        const iosRank=(source)=>{
          const type=sourceType(source);
          const hasKey=
            String(source.keyId||source.key_id||'').trim() &&
            String(source.keyData||source.key_data||'').trim();
          if(!sourceSupport(source).ok)return 99;
          if(type==='hls')return 0;
          if(type==='flv')return 1;
          if(type==='mp4')return 2;
          if(type==='dash'&&!hasKey)return 3;
          if(type==='auto')return 4;
          return 9;
        };
        if(iosRank(sources[startIndex])>=90){
          let best=-1,bestRank=100;
          sources.forEach((source,i)=>{
            const rank=iosRank(source);
            if(rank<bestRank){best=i;bestRank=rank}
          });
          if(best>=0) startIndex=best;
        }
      }
      currentSourceIndex=startIndex;
      updateServerButton(startIndex);
      video.classList.remove('fill');
      fitButton.textContent='Fill';
      clearManualRotation();
      syncIOSSystemRotationControls();
      overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');
      layoutIOSVideoFrame();
      if(!isIOS())hideControls();
      await loadSource(startIndex);
    };
  })();
  </script>
</body>
</html>
