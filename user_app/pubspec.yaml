name: football_viewer
description: Football streaming viewer app starter.
publish_to: "none"
version: 9.8.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_ios_video: ^1.1.4
  intl: ^0.20.0
  shared_preferences: ^2.5.3
  http: ^1.2.2
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  posthog_flutter: ^5.40.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nca_icon.png
    - assets/embedded_player.html
