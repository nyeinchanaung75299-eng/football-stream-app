name: Verify Admin Stream Detector

on:
  pull_request:
    branches: [main]
    paths:
      - 'admin_app/**'
      - 'user_app/**'
      - 'cloudflare/public-api/src/website_stream_scanner.mjs'
      - 'scripts/test_website_stream_scanner.mjs'
      - 'scripts/test_browser_stream_scanner.mjs'
      - 'vercel/network-backup/**'
      - 'supabase/functions/_shared/arena_source.mjs'
      - 'scripts/test_arena_source.mjs'
      - 'supabase/functions/_shared/darkbyte_catalog.mjs'
      - 'supabase/functions/channel-source-sync/**'
      - 'scripts/test_darkbyte_channel_source.mjs'
      - 'supabase/functions/_shared/livetv_sports.mjs'
      - 'scripts/test_livetv_sports.mjs'
      - 'supabase/functions/_shared/repository_mpd.mjs'
      - 'scripts/test_repository_mpd.mjs'
      - 'supabase/functions/_shared/repository_matches.mjs'
      - 'supabase/functions/_shared/repository_updates.mjs'
      - 'supabase/functions/_shared/repository_trees.mjs'
      - 'supabase/functions/_shared/channel_media_probe.mjs'
      - 'supabase/functions/stream-health/**'
      - 'scripts/test_repository_matches.mjs'
      - 'scripts/test_channel_media_probe.mjs'
      - '.github/workflows/verify-admin-stream-detector.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test website scanner API and network backup
        run: |
          python3 -m unittest discover -s scripts -p 'test_configure_gradle_distribution.py'
          node --test scripts/test_website_stream_scanner.mjs
          node --test scripts/test_browser_stream_scanner.mjs
          node --test vercel/network-backup/test_proxy.mjs
          node --test scripts/test_website_sources.mjs
          node --test scripts/test_arena_source.mjs
          node --test scripts/test_yyzb_schedule.mjs scripts/test_live2_gateway.mjs
          node --test scripts/test_darkbyte_channel_source.mjs
          node --test scripts/test_livetv_sports.mjs
          node --test scripts/test_repository_mpd.mjs
          node --test scripts/test_repository_matches.mjs scripts/test_repository_trees.mjs scripts/test_channel_media_probe.mjs scripts/test_channel_health_api.mjs
          node --test scripts/test_epg_host_match.mjs
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        working-directory: admin_app
        run: |
          flutter create --platforms=android .
          python3 ../scripts/configure_gradle_distribution.py android/gradle/wrapper/gradle-wrapper.properties
          rm -f test/widget_test.dart
      - name: Install dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Analyze and test
        working-directory: admin_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Verify Web-only Admin source cache in Chrome
        if: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[admin-web-only]') }}
        working-directory: admin_app
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          CHROME_EXECUTABLE="$CHROME_BIN" flutter test --platform chrome test/admin_web_source_cache_test.dart

      - name: Generate Admin Web platform
        working-directory: admin_app
        run: flutter create --platforms=web .
      - name: Compile Admin Web release
        working-directory: admin_app
        run: flutter build web --release --base-href "/football-stream-app/admin/"
      - name: Verify cache stamping on generated Flutter Web build
        working-directory: admin_app
        run: |
          python3 -m unittest discover -s ../scripts -p 'test_stamp_flutter_web_cache.py'
          python3 ../scripts/stamp_flutter_web_cache.py build/web "$GITHUB_SHA"
          grep -q 'main.dart.js?v=' build/web/flutter_bootstrap.js
          grep -q 'flutter_bootstrap.js?v=' build/web/index.html
      - name: Compile debug APK
        # Web-only PRs must not build any APK, even a debug artifact.
        if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.title, '[admin-web-only]') }}
        working-directory: admin_app
        run: flutter build apk --debug

  viewer-check:
    # These changes touch only Admin Web; skip native Viewer generation/build.
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.pull_request.title, '[admin-web-only]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Viewer Android project
        working-directory: user_app
        run: |
          flutter create --platforms=android .
          python3 ../scripts/configure_gradle_distribution.py android/gradle/wrapper/gradle-wrapper.properties
          rm -f test/widget_test.dart
      - name: Verify compact Web and native player UI contracts
        run: |
          python3 scripts/generate_embedded_player.py --check
          node --test scripts/test_android_player_web_parity.mjs
          node scripts/test_web_player.mjs
      # Compile the ACTUAL Kotlin player used by release builds, not Flutter's
      # generated default Activity, so native UI changes are checked before merge.
      - name: Patch Viewer native Media3 player for PR compile
        working-directory: user_app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import shutil
          gk = Path('android/app/build.gradle.kts')
          s = gk.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          if 'androidx.media3:media3-exoplayer:' not in s:
              s += """
          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.4.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.4.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.4.1")
              implementation("androidx.media3:media3-ui:1.4.1")
          }
          """
          gk.write_text(s)
          dest = Path('android/app/src/main/kotlin/com/example/football_viewer')
          dest.mkdir(parents=True, exist_ok=True)
          for name in ('MainActivity.kt', 'NativePlayerActivity.kt'):
              shutil.copy2(Path('android_patch') / name, dest / name)
          java = Path('android/app/src/main/java/com/example/football_viewer')
          java.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path('android_patch/PlaybackSourceSessions.java'), java / 'PlaybackSourceSessions.java')
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          xml = manifest.read_text()
          if 'NativePlayerActivity' not in xml:
              xml = xml.replace('    </application>',
                  '        <activity android:name=".NativePlayerActivity" android:exported="false" />' + chr(10) +
                  '    </application>')
          manifest.write_text(xml)
          PY2
      - name: Install Viewer dependencies
        working-directory: user_app
        run: flutter pub get
      - name: Analyze and test Viewer
        working-directory: user_app
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Compile Viewer debug APK
        working-directory: user_app
        run: flutter build apk --debug
