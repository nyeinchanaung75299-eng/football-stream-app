name: Sync Public Match Feed

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/sync-public-feed.yml"
      - "scripts/sync_public_feed.py"
      - "supabase/functions/public-feed-lines/index.ts"
      - "user_app/lib/screens/home_page.dart"
      - "user_app/lib/screens/source_browser_page.dart"
      - "admin_app/lib/screens/soco_import_page.dart"
      - "admin_app/lib/screens/fixture_import_page.dart"
      - "supabase/functions/source-match-list/index.ts"
      - "supabase/functions/soco-links/index.ts"
  schedule:
    # GitHub scheduled workflows have a practical 5-minute minimum. Offset
    # the run from the busiest :00/:05 boundaries to reduce delayed/dropped
    # scheduled executions, while viewer changes still refresh immediately.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: public-match-feed
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch public matches from Supabase
        env:
          SUPABASE_URL: https://woggzixprvyjnfjzsglz.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ka-rZxHdJUMYng6WJDDQUg_ZcWZJl3O
        run: |
          python3 scripts/sync_public_feed.py /tmp/matches.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/matches.json', encoding='utf-8'))
          print(f"mirror matches: {len(data)}")
          PY

      - name: Fetch source-list snapshots for VPN-off fallback
        run: |
          set -u
          mkdir -p /tmp/source-feeds
          for source in soco yyzb fawa cola; do
            stamp="$(date +%s)"
            fetched=false
            for url in               "https://football-public-api.nyeinchanaung75299-eng.workers.dev/sources/$source/matches?t=$stamp"               "https://football-api.nyeinchanaung.us.ci/sources/$source/matches?t=$stamp"               "https://woggzixprvyjnfjzsglz.supabase.co/functions/v1/soco-links?viewer_public=1&action=matches&source=$source&t=$stamp"; do
              if curl --fail --location --retry 1 --retry-delay 1 --connect-timeout 8 --max-time 35                 -H "Accept: application/json"                 "$url" -o "/tmp/source-feeds/$source.json.tmp"; then
                fetched=true
                break
              fi
            done
            if [ "$fetched" = true ]; then
              SOURCE="$source" python3 - <<'PY'
          import json, os
          from pathlib import Path
          source = os.environ["SOURCE"]
          p = Path(f"/tmp/source-feeds/{source}.json.tmp")
          data = json.loads(p.read_text(encoding="utf-8"))
          rows = data.get("matches")
          if not isinstance(rows, list):
              raise SystemExit(f"{source}: invalid matches payload")
          # Remove volatile timestamps so the feed branch only changes when
          # actual source data changes.
          data.pop("generated_at", None)
          out = Path(f"/tmp/source-feeds/{source}.json")
          out.write_text(
              json.dumps(data, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print(f"{source} mirror matches: {len(rows)}")
          PY
            else
              echo "Warning: $source snapshot fetch failed; keeping previous mirror."
              rm -f "/tmp/source-feeds/$source.json.tmp"
            fi
          done

      - name: Publish feed branch
        id: publish_feed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin feed >/dev/null 2>&1; then
            git fetch origin feed
            git switch -C feed origin/feed
          else
            git switch --orphan feed
            git rm -rf . || true
          fi

          mkdir -p public
          MATCHES_CHANGED=true
          if [ -f public/matches.json ] && cmp -s /tmp/matches.json public/matches.json; then
            MATCHES_CHANGED=false
          fi
          cp /tmp/matches.json public/matches.json

          mkdir -p public/sources
          for source in soco yyzb fawa cola; do
            if [ -s "/tmp/source-feeds/$source.json" ]; then
              cp "/tmp/source-feeds/$source.json" "public/sources/$source.json"
            fi
          done

          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          json.dump(
              {"ok": True, "updated_at": datetime.now(timezone.utc).isoformat()},
              open("public/status.json","w", encoding="utf-8"),
              separators=(",", ":"),
          )
          PY

          rm -f public/streams.json
          # Stage metadata and tracked deletions without requiring the removed
          # streams.json to exist; existing signed releases stay on feed.
          git add -A public/

          if git diff --cached --quiet; then
            echo "No feed changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Update public match feed"
          git push origin feed
          # status.json freshness updates should not rebuild the whole app.
          echo "changed=$MATCHES_CHANGED" >> "$GITHUB_OUTPUT"

      - name: Redeploy Web Viewer with latest feed
        if: steps.publish_feed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-web.yml --ref "${{ github.event.repository.default_branch }}"
