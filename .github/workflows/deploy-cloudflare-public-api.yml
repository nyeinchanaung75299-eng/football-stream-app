name: Deploy Cloudflare Public API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "cloudflare/public-api/**"
      - ".github/workflows/deploy-cloudflare-public-api.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi

      - name: Checkout
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/checkout@v7

      - name: Set up Node 24
        if: steps.cloudflare.outputs.ready == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test protected HLS/DASH proxy
        if: steps.cloudflare.outputs.ready == 'true'
        run: node scripts/test_protected_dash_proxy.mjs

      - name: Deploy Worker
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: cloudflare/public-api
        run: npx --yes wrangler@4 deploy

      - name: Add Supabase publishable key to Worker
        if: steps.cloudflare.outputs.ready == 'true' && env.SUPABASE_PUBLISHABLE_KEY != ''
        working-directory: cloudflare/public-api
        shell: bash
        run: printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | npx --yes wrangler@4 secret put SUPABASE_PUBLISHABLE_KEY
