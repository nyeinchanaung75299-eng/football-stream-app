name: Deploy Cloudflare Public API

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "cloudflare/public-api/**"
      - "scripts/test_public_match_feed.mjs"
      - "scripts/test_backend_startup.mjs"
      - "scripts/test_football_names.mjs"
      - "supabase/functions/_shared/football_names.mjs"
      - "supabase/functions/_shared/website_sources.mjs"
      - "supabase/functions/_shared/arena_source.mjs"
      - "supabase/functions/_shared/darkbyte_catalog.mjs"
      - "supabase/functions/channel-source-sync/index.ts"
      - "scripts/test_darkbyte_channel_source.mjs"
      - "scripts/test_arena_source.mjs"
      - "supabase/functions/_shared/totalsportek_source.mjs"
      - "scripts/test_totalsportek_source.mjs"
      - "scripts/test_website_sources.mjs"
      - "supabase/functions/_shared/source_match_rows.mjs"
      - "supabase/functions/_shared/experimental_football_sources.mjs"
      - "supabase/functions/_shared/public_source_media.mjs"
      - "supabase/functions/_shared/public_football_feeds.mjs"
      - "scripts/test_public_source_adapters.mjs"
      - "scripts/test_experimental_football_sources.mjs"
      - "scripts/test_fawa_source.mjs"
      - "scripts/test_soco_match_catalog.mjs"
      - "scripts/test_website_stream_scanner.mjs"
      - "supabase/functions/source-match-list/index.ts"
      - "supabase/functions/soco-links/index.ts"
      - "supabase/functions/football-fixtures/index.ts"
      - ".github/workflows/deploy-cloudflare-public-api.yml"

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Cloudflare connection
        id: cloudflare
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; skipping deployment."
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Test protected HLS/DASH proxy
        run: node scripts/test_protected_dash_proxy.mjs

      - name: Test Supabase relay
        run: node scripts/test_supabase_relay.mjs

      - name: Test public website providers
        run: node --test scripts/test_website_sources.mjs scripts/test_totalsportek_source.mjs scripts/test_arena_source.mjs scripts/test_darkbyte_channel_source.mjs

      - name: Test published football fixtures and media chains
        run: node --test scripts/test_experimental_football_sources.mjs scripts/test_public_source_adapters.mjs

      - name: Test public match feed
        run: node --test scripts/test_public_match_feed.mjs

      - name: Test metadata deadlines and first-chunk health probes
        run: node --test scripts/test_backend_startup.mjs

      - name: Test English fixture imports
        run: node --test scripts/test_football_names.mjs

      - name: Test website stream scanner
        run: node --test scripts/test_website_stream_scanner.mjs

      - name: Test Fawa literal stream extraction
        run: node --test scripts/test_fawa_source.mjs

      - name: Test Soco fixture catalog completeness
        run: node --test scripts/test_soco_match_catalog.mjs

      - name: Deploy Worker
        if: steps.cloudflare.outputs.ready == 'true'
        working-directory: cloudflare/public-api
        run: npx --yes wrangler@4 deploy --keep-vars
