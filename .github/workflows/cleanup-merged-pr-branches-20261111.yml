            const keepProtected=(name)=>name==='main'||name==='feed'||/^(release|test)\//.test(name);
            const pulls=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            const byNumber=new Map(pulls.map(p=>[p.number,p]));
            const openBranches=new Set(pulls.filter(p=>p.state==='open').map(p=>p.head.ref));
            const eligible=[];
            const skipped=[];
            for(const [name,expectedSha,prNumber] of snapshot){
              if(keepProtected(name)||openBranches.has(name)){skipped.push(name+' protected or open');continue;}
              const pr=byNumber.get(prNumber);
              if(!pr||pr.state!=='closed'||!pr.merged_at||pr.base?.ref!=='main'||
                 pr.head?.repo?.full_name!==owner+'/'+repo||
                 pr.head?.ref!==name||pr.head?.sha!==expectedSha){
                skipped.push(name+' PR no longer matches');continue;
              }
              try{
                const branch=(await github.rest.repos.getBranch({owner,repo,branch:name})).data;
                if(branch.protected||branch.commit.sha!==expectedSha){
                  skipped.push(name+' protected/changed');continue;
                }
                eligible.push([name,expectedSha,prNumber]);
              }catch(error){
                if(error.status===404){skipped.push(name+' already absent');continue;}
                throw error;
              }
            }
            core.info('Audited snapshot: '+snapshot.length+
                      '; eligible exact merged heads: '+eligible.length+
                      '; skipped: '+skipped.length);
            if(snapshot.length>180||eligible.length>180)throw new Error('Safety ceiling exceeded');
            if(eligible.length<160)throw new Error('Safety floor: too many unexpected changes; abort');
            if(!shouldDelete){
              core.notice('DRY RUN only — no branches deleted. Eligible: '+eligible.length+
                          '; preserved/changed: '+skipped.length);
              await core.summary.addHeading('GitHub merged branch cleanup — dry run')
                .addRaw('Audited: '+snapshot.length+' / Safe to delete: '+eligible.length+
                        ' / Skipped: '+skipped.length+' / Deleted: 0').write();
              return;
            }
            let removed=0, failures=[];
            for(const [name,sha,prNumber] of eligible){
              try{
                const branch=(await github.rest.repos.getBranch({owner,repo,branch:name})).data;
                if(branch.protected||branch.commit.sha!==sha){
                  skipped.push(name+' changed before deletion');
                  continue;
                }
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+name});
                core.info('Deleted merged PR #'+prNumber+' source branch '+name);
                removed++;
              }catch(error){
                failures.push(name+' ('+(error.message||error)+')');
                core.warning('Preserved failed branch '+name+': '+(error.message||error));
              }
            }
            core.notice('DELETED '+removed+' unchanged merged branches; preserved '+
                        (skipped.length+failures.length)+' unmatched/operational.');
            await core.summary.addHeading('One-time merged PR source branch cleanup')
              .addRaw('Deleted: '+removed+' / Skipped: '+skipped.length+
                      ' / Failed: '+failures.length+
                      '. The PRs, production main, release feed and history are unchanged.').write();
            if(failures.length)core.setFailed('Some branches could not be removed: '+failures.join('; '));
