name: Build Android V9.8 APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write
  actions: write

concurrency:
  group: nca-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform for Admin
        working-directory: admin_app
        run: |
          HAD_WIDGET_TEST=false
          if [ -e test/widget_test.dart ]; then HAD_WIDGET_TEST=true; fi
          flutter create --platforms=android .
          # The generated counter test targets MyApp, which is not this app.
          # Keep any test that was already part of the checked-out project.
          if [ "$HAD_WIDGET_TEST" = false ]; then rm -f test/widget_test.dart; fi

      - name: Patch Admin permissions
        working-directory: admin_app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms=['<uses-permission android:name="android.permission.INTERNET"/>','<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>']
          missing=[x for x in perms if x not in s]
          if missing:
              s=s.replace(marker, marker+'\n    '+'\n    '.join(missing))
          posthog_meta='        <meta-data android:name="com.posthog.posthog.AUTO_INIT" android:value="false" />\n'
          if 'com.posthog.posthog.AUTO_INIT' not in s:
              s=s.replace('    </application>', posthog_meta+'    </application>')
          import re, shutil
          s=re.sub(r'android:label="[^"]+"','android:label="NCA Admin"',s,count=1)
          s=s.replace('@mipmap/ic_launcher','@drawable/nca_icon')
          p.write_text(s)
          icon=Path('android/app/src/main/res/drawable/nca_icon.webp')
          icon.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('../user_app/assets/nca_icon.webp', icon)
          PY2

      - name: Get Admin dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Verify Admin source
        working-directory: admin_app
        run: |
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Admin tests found; analyze gate passed."
          fi

      - name: Build Admin release APKs
        working-directory: admin_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Admin APKs
        uses: actions/upload-artifact@v7
        with:
          name: NCA-Admin-V9.8-Release-APKs
          path: admin_app/build/app/outputs/flutter-apk/*-release.apk

      - name: Create Android platform for Viewer
        working-directory: user_app
        run: |
          HAD_WIDGET_TEST=false
          if [ -e test/widget_test.dart ]; then HAD_WIDGET_TEST=true; fi
          flutter create --platforms=android .
          if [ "$HAD_WIDGET_TEST" = false ]; then rm -f test/widget_test.dart; fi

      - name: Patch Viewer for Android 12 Media3
        working-directory: user_app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import shutil
          m=Path('android/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms=['<uses-permission android:name="android.permission.INTERNET"/>','<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>','<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>']
          missing=[x for x in perms if x not in s]
          if missing: s=s.replace(marker, marker+'\n    '+'\n    '.join(missing))
          activity='        <activity android:name=".NativePlayerActivity" android:screenOrientation="sensorLandscape" android:configChanges="orientation|screenSize|keyboardHidden" android:exported="false" android:theme="@style/LaunchTheme" />\n'
          if 'NativePlayerActivity' not in s: s=s.replace('    </application>', activity+'    </application>')
          posthog_meta='        <meta-data android:name="com.posthog.posthog.AUTO_INIT" android:value="false" />\n'
          if 'com.posthog.posthog.AUTO_INIT' not in s:
              s=s.replace('    </application>', posthog_meta+'    </application>')
          import re
          s=re.sub(r'android:label="[^"]+"','android:label="NCA"',s,count=1)
          if 'android:usesCleartextTraffic=' not in s:
              s=s.replace('<application', '<application android:usesCleartextTraffic="false"', 1)
          s=s.replace('@mipmap/ic_launcher','@drawable/nca_icon')
          m.write_text(s)
          icon=Path('android/app/src/main/res/drawable/nca_icon.webp')
          icon.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2('assets/nca_icon.webp', icon)

          gk=Path('android/app/build.gradle.kts')
          if gk.exists():
              g=gk.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 24')
              if 'androidx.media3:media3-exoplayer:' not in g:
                  g += '\n\ndependencies {\n    implementation("androidx.media3:media3-exoplayer:1.4.1")\n    implementation("androidx.media3:media3-exoplayer-hls:1.4.1")\n    implementation("androidx.media3:media3-exoplayer-dash:1.4.1")\n    implementation("androidx.media3:media3-ui:1.4.1")\n}\n'
              gk.write_text(g)
          else:
              gp=Path('android/app/build.gradle')
              g=gp.read_text().replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              if 'androidx.media3:media3-exoplayer:' not in g:
                  g += '\n\ndependencies {\n    implementation "androidx.media3:media3-exoplayer:1.4.1"\n    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"\n    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"\n    implementation "androidx.media3:media3-ui:1.4.1"\n}\n'
              gp.write_text(g)

          dest=Path('android/app/src/main/kotlin/com/example/football_viewer')
          dest.mkdir(parents=True, exist_ok=True)
          shutil.copy2('android_patch/MainActivity.kt', dest/'MainActivity.kt')
          shutil.copy2('android_patch/NativePlayerActivity.kt', dest/'NativePlayerActivity.kt')
          PY2

      - name: Configure stable Viewer signing
        working-directory: user_app
        env:
          NCA_KEYSTORE_B64: ${{ secrets.NCA_KEYSTORE_B64 }}
          NCA_KEYSTORE_PASSWORD: ${{ secrets.NCA_KEYSTORE_PASSWORD }}
          NCA_KEY_ALIAS: ${{ secrets.NCA_KEY_ALIAS }}
          NCA_KEY_PASSWORD: ${{ secrets.NCA_KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$NCA_KEYSTORE_B64" ] || [ -z "$NCA_KEYSTORE_PASSWORD" ] || [ -z "$NCA_KEY_ALIAS" ] || [ -z "$NCA_KEY_PASSWORD" ]; then
            echo "NCA_SIGNING_READY=false" >> "$GITHUB_ENV"
            echo "Stable signing secrets are not configured. Building fallback APK only; in-app updater publication will be skipped."
            exit 0
          fi

          echo "$NCA_KEYSTORE_B64" | base64 -d > android/app/nca-release.jks
          cat > android/key.properties <<EOF
          storePassword=$NCA_KEYSTORE_PASSWORD
          keyPassword=$NCA_KEY_PASSWORD
          keyAlias=$NCA_KEY_ALIAS
          storeFile=nca-release.jks
          EOF

          python3 - <<'PY2'
          from pathlib import Path

          gk = Path('android/app/build.gradle.kts')
          if not gk.exists():
              raise SystemExit('Expected Kotlin Gradle build file was not generated.')

          s = gk.read_text()
          if 'val ncaKeystoreProperties = Properties()' not in s:
              imports = (
                  'import java.io.FileInputStream\n'
                  'import java.util.Properties\n\n'
              )
              properties = (
                  'val ncaKeystoreProperties = Properties()\n'
                  'val ncaKeystorePropertiesFile = rootProject.file("key.properties")\n'
                  'if (ncaKeystorePropertiesFile.exists()) {\n'
                  '    ncaKeystoreProperties.load(FileInputStream(ncaKeystorePropertiesFile))\n'
                  '}\n\n'
              )
              if 'plugins {' not in s or 'android {' not in s:
                  raise SystemExit('Expected Flutter Gradle template blocks were not found.')
              # Gradle requires plugins before arbitrary declarations/blocks.
              s = imports + s.replace('android {', properties + 'android {', 1)

          if 'create("ncaRelease")' not in s:
              signing = (
                  '    signingConfigs {\n'
                  '        create("ncaRelease") {\n'
                  '            keyAlias = ncaKeystoreProperties["keyAlias"] as String\n'
                  '            keyPassword = ncaKeystoreProperties["keyPassword"] as String\n'
                  '            storeFile = file(ncaKeystoreProperties["storeFile"] as String)\n'
                  '            storePassword = ncaKeystoreProperties["storePassword"] as String\n'
                  '        }\n'
                  '    }\n\n'
              )
              if '    buildTypes {' not in s:
                  raise SystemExit('Expected Flutter Gradle buildTypes block was not found.')
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)

          s = s.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("ncaRelease")',
          )
          if 'signingConfig = signingConfigs.getByName("ncaRelease")' not in s:
              raise SystemExit('Release signing configuration was not applied.')
          gk.write_text(s)
          PY2

          echo "NCA_SIGNING_READY=true" >> "$GITHUB_ENV"

      - name: Get Viewer dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Verify Viewer source
        working-directory: user_app
        run: |
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Viewer tests found; analyze gate passed."
          fi

      - name: Build Viewer release APKs
        working-directory: user_app
        run: |
          BUILD_NUMBER=$((10000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --split-per-abi \
            --build-name 9.8.0 \
            --build-number "$BUILD_NUMBER"
          flutter build apk --release \
            --build-name 9.8.0 \
            --build-number "$BUILD_NUMBER"
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/NCA-latest.apk
          APK_SHA256="$(sha256sum /tmp/NCA-latest.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c%s /tmp/NCA-latest.apk)"
          echo "NCA_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "NCA_APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "NCA_APK_SIZE=$APK_SIZE" >> "$GITHUB_ENV"

      - name: Upload Viewer APKs
        uses: actions/upload-artifact@v7
        with:
          name: NCA-V9.8-Release-APKs
          path: user_app/build/app/outputs/flutter-apk/*-release.apk

      - name: Publish in-app updater release
        if: env.NCA_SIGNING_READY == 'true'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed:refs/remotes/origin/feed

          rm -rf /tmp/nca-feed
          git worktree add --detach /tmp/nca-feed origin/feed
          cd /tmp/nca-feed
          git switch -C feed origin/feed

          mkdir -p public/releases
          cp /tmp/NCA-latest.apk public/releases/NCA-latest.apk

          python3 - <<'PY'
          import json, os
          data = {
              "version_name": "9.8.0",
              "build_number": int(os.environ["NCA_BUILD_NUMBER"]),
              "apk_url": "https://nyeinchanaung75299-eng.github.io/football-stream-app/releases/NCA-latest.apk",
              "sha256": os.environ["NCA_APK_SHA256"],
              "size_bytes": int(os.environ["NCA_APK_SIZE"]),
              "mandatory": False,
              "notes": "NCA update is ready. Includes live-score, stream, VPN-free fallback and stability improvements."
          }
          with open("public/releases/latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, separators=(",", ":"))
          PY

          git add public/releases/NCA-latest.apk public/releases/latest.json
          if git diff --cached --quiet; then
            echo "Release feed already up to date."
            exit 0
          fi

          git commit -m "Publish NCA Android update $NCA_BUILD_NUMBER"

          for attempt in 1 2 3; do
            git pull --rebase origin feed || true
            if git push origin feed; then
              exit 0
            fi
            sleep 3
          done

          echo "Failed to publish in-app updater release."
          exit 1

      - name: Refresh GitHub Pages release files
        if: env.NCA_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref "${GITHUB_REF_NAME}"
