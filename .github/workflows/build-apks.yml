name: Build Android Release APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter info
        run: |
          flutter --version
          java -version

      # ---------------- ADMIN APP ----------------
      - name: Create Android platform for Admin App
        working-directory: admin_app
        run: flutter create --platforms=android .

      - name: Ensure Admin Internet Permission
        working-directory: admin_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + perm
              )
              p.write_text(s)
          PY

      - name: Get Admin dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Build Admin Release APKs
        working-directory: admin_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Admin Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Football-Admin-Release-APKs
          path: admin_app/build/app/outputs/flutter-apk/*-release.apk

      # ---------------- USER APP ----------------
      - name: Create Android platform for User App
        working-directory: user_app
        run: flutter create --platforms=android .

      - name: Set User App minSdk 24
        working-directory: user_app
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - name: Ensure User Internet Permission
        working-directory: user_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + perm
              )
              p.write_text(s)
          PY

      - name: Get User dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Build User Release APKs
        working-directory: user_app
        run: flutter build apk --release --split-per-abi

      - name: Upload User Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Football-User-Release-APKs
          path: user_app/build/app/outputs/flutter-apk/*-release.apk
