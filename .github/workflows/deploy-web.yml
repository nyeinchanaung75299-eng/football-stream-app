name: Build and Deploy Web Viewer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "user_app/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Viewer dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Build Viewer Web
        working-directory: user_app
        run: |
          flutter build web --release \
            --base-href "/football-stream-app/" \
            --dart-define=PUBLIC_API_BASE="${{ vars.PUBLIC_API_BASE }}"
          cp build/web/index.html build/web/404.html

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Football-Viewer-V9.1-Web
          path: user_app/build/web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
