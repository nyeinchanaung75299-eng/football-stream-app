name: Build and Deploy Web Viewer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "user_app/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Viewer dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Build Viewer Web
        working-directory: user_app
        run: |
          flutter build web --release --base-href "/football-stream-app/"
          # GitHub Pages controls response cache headers, so stamp the
          # bootstrap URL on every deploy. This prevents an old Flutter shell
          # from surviving a new release while still allowing heavy assets to
          # remain browser-cached for fast repeat visits.
          BUILD_ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          build_id = sys.argv[1]
          s = s.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          p.write_text(s, encoding="utf-8")
          PY
          cp build/web/index.html build/web/404.html

      - name: Add same-origin VPN-off match backup
        working-directory: user_app
        run: |
          git fetch origin feed:refs/remotes/origin/feed
          git show origin/feed:public/matches.json > build/web/matches.json
          git show origin/feed:public/streams.json > build/web/streams.json
          git show origin/feed:public/status.json > build/web/status.json || true

          mkdir -p build/web/releases
          git show origin/feed:public/releases/latest.json > build/web/releases/latest.json || true
          git show origin/feed:public/releases/NCA-latest.apk > build/web/releases/NCA-latest.apk || true

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NCA-V9.8-Web
          path: user_app/build/web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
