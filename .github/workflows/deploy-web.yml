name: Build and Deploy Web Viewer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "user_app/**"
      - "admin_app/**"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Viewer dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Verify Viewer source
        working-directory: user_app
        run: |
          python3 ../scripts/generate_embedded_player.py --check
          node ../scripts/test_web_player.mjs
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Viewer tests found; analyze gate passed."
          fi

      - name: Build Viewer Web
        working-directory: user_app
        run: |
          flutter build web --release --base-href "/football-stream-app/" --pwa-strategy=none
          # GitHub Pages controls response cache headers, so stamp the
          # bootstrap URL on every deploy. This prevents an old Flutter shell
          # from surviving a new release while still allowing heavy assets to
          # remain browser-cached for fast repeat visits.
          BUILD_ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          build_id = sys.argv[1]
          s = s.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          p.write_text(s, encoding="utf-8")
          PY
          # Disable Flutter's service-worker cache. Live match data must not
          # be pinned to an older web release after a VPN/network change.
          cp build/web/index.html build/web/404.html

      - name: Create Admin Web platform
        working-directory: admin_app
        run: |
          flutter create . --platforms web
          # flutter create adds the template counter test to projects that did
          # not already have a test directory. It references the template
          # MyApp class, not NCA Admin, and must not block the real Admin build.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi

      - name: Get Admin Web dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Verify Admin Web source
        working-directory: admin_app
        run: flutter analyze --no-fatal-infos

      - name: Build Admin Web under /admin/
        working-directory: admin_app
        run: |
          flutter build web --release \
            --base-href "/football-stream-app/admin/" \
            --pwa-strategy=none

          BUILD_ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          build_id = sys.argv[1]
          s = s.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          p.write_text(s, encoding="utf-8")
          PY

          cp build/web/index.html build/web/404.html

      - name: Add Admin Web to Viewer Pages build
        run: |
          rm -rf user_app/build/web/admin
          mkdir -p user_app/build/web/admin
          cp -R admin_app/build/web/. user_app/build/web/admin/

      - name: Add same-origin VPN-off metadata backup
        working-directory: user_app
        run: |
          git fetch origin feed:refs/remotes/origin/feed
          git show origin/feed:public/matches.json > build/web/matches.json
          git show origin/feed:public/status.json > build/web/status.json || true

          # Signing may not be configured yet. Publish a release only when both
          # files exist, rather than leaving empty files from failed redirects.
          if git cat-file -e origin/feed:public/releases/latest.json 2>/dev/null && \
             git cat-file -e origin/feed:public/releases/NCA-latest.apk 2>/dev/null; then
            mkdir -p build/web/releases
            git show origin/feed:public/releases/latest.json > build/web/releases/latest.json
            git show origin/feed:public/releases/NCA-latest.apk > build/web/releases/NCA-latest.apk
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = Path('build/web/releases')
          manifest = json.loads((release / 'latest.json').read_text(encoding='utf-8'))
          apk = (release / 'NCA-latest.apk').read_bytes()
          if not apk or len(apk) != manifest['size_bytes']:
              raise SystemExit('Release APK size does not match the updater manifest.')
          if hashlib.sha256(apk).hexdigest() != manifest['sha256']:
              raise SystemExit('Release APK hash does not match the updater manifest.')
          PY
          else
            echo "No complete signed updater release on feed yet."
          fi

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NCA-V9.8-Web
          path: user_app/build/web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
