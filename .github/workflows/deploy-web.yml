name: Build and Deploy Web Viewer

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - "user_app/**"
      - "admin_app/**"
      - "scripts/test_web_player.mjs"
      - "scripts/generate_embedded_player.py"
      - ".github/workflows/deploy-web.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify monitoring authentication and credential handling
        run: node --test scripts/test_system_monitor.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Viewer dependencies
        working-directory: user_app
        run: flutter pub get

      - name: Verify Viewer source
        working-directory: user_app
        run: |
          python3 ../scripts/generate_embedded_player.py --check
          node ../scripts/test_web_player.mjs
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No Viewer tests found; analyze gate passed."
          fi

      - name: Vendor Shaka Player for Web DASH
        working-directory: user_app
        run: |
          mkdir -p web/vendor
          curl --fail --location --retry 3 \
            "https://ajax.googleapis.com/ajax/libs/shaka-player/5.2.12/shaka-player.compiled.js" \
            -o web/vendor/shaka-player.compiled.js
          test -s web/vendor/shaka-player.compiled.js

      - name: Build Viewer Web
        working-directory: user_app
        run: |
          flutter build web --release --base-href "/football-stream-app/" --pwa-strategy=none --no-web-resources-cdn
          # GitHub Pages controls response cache headers, so stamp the
          # bootstrap URL on every deploy. This prevents an old Flutter shell
          # from surviving a new release while still allowing heavy assets to
          # remain browser-cached for fast repeat visits.
          BUILD_ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys
          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          build_id = sys.argv[1]
          s = s.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          p.write_text(s, encoding="utf-8")
          PY
          # Disable Flutter's service-worker cache. Live match data must not
          # be pinned to an older web release after a VPN/network change.
          cp build/web/index.html build/web/404.html

      - name: Create Admin Web platform
        working-directory: admin_app
        run: |
          flutter create . --platforms web
          # flutter create adds the template counter test to projects that did
          # not already have a test directory. It references the template
          # MyApp class, not NCA Admin, and must not block the real Admin build.
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm -f test/widget_test.dart
          fi

      - name: Get Admin Web dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Verify Admin Web source
        working-directory: admin_app
        run: |
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          fi

      - name: Build Admin Web under /admin/
        working-directory: admin_app
        run: |
          flutter build web --release \
            --base-href "/football-stream-app/admin/" \
            --pwa-strategy=none --no-web-resources-cdn

          BUILD_ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          python3 - "$BUILD_ID" <<'PY'
          from pathlib import Path
          import sys

          p = Path("build/web/index.html")
          s = p.read_text(encoding="utf-8")
          build_id = sys.argv[1]
          s = s.replace(
              'src="flutter_bootstrap.js"',
              f'src="flutter_bootstrap.js?v={build_id}"',
          )
          p.write_text(s, encoding="utf-8")
          PY

          cp build/web/index.html build/web/404.html

      - name: Add Admin Web to Viewer Pages build
        run: |
          rm -rf user_app/build/web/admin
          mkdir -p user_app/build/web/admin
          cp -R admin_app/build/web/. user_app/build/web/admin/

      - name: Add same-origin VPN-off metadata backup
        working-directory: user_app
        run: |
          git fetch origin feed:refs/remotes/origin/feed
          git show origin/feed:public/matches.json > build/web/matches.json
          git show origin/feed:public/status.json > build/web/status.json || true

          mkdir -p build/web/sources
          for source in soco yyzb fawa cola; do
            if git cat-file -e "origin/feed:public/sources/$source.json" 2>/dev/null; then
              git show "origin/feed:public/sources/$source.json" > "build/web/sources/$source.json"
            else
              echo "No $source source mirror on feed yet."
            fi
          done

          # Signing may not be configured yet. Publish a release only when both
          # files exist, rather than leaving empty files from failed redirects.
          if git cat-file -e origin/feed:public/releases/latest.json 2>/dev/null && \
             git cat-file -e origin/feed:public/releases/NCA-latest.apk 2>/dev/null; then
            mkdir -p build/web/releases
            git show origin/feed:public/releases/latest.json > build/web/releases/latest.json
            git show origin/feed:public/releases/NCA-latest.apk > build/web/releases/NCA-latest.apk
            python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          release = Path('build/web/releases')
          manifest = json.loads((release / 'latest.json').read_text(encoding='utf-8'))
          apk = (release / 'NCA-latest.apk').read_bytes()
          if not apk or len(apk) != manifest['size_bytes']:
              raise SystemExit('Release APK size does not match the updater manifest.')
          if hashlib.sha256(apk).hexdigest() != manifest['sha256']:
              raise SystemExit('Release APK hash does not match the updater manifest.')
          PY
          else
            echo "No complete signed updater release on feed yet."
          fi

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NCA-V9.8-Web
          path: user_app/build/web

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: user_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  report:
    name: Record current-main web deploy status
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish Web CI status to feed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -e
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          build = os.environ["BUILD_RESULT"]
          deploy = os.environ["DEPLOY_RESULT"]
          data = {
              "sha": os.environ["HEAD_SHA"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_number": int(os.environ["RUN_NUMBER"]),
              "workflow": "Build and Deploy Web Viewer",
              "build": build,
              "deploy": deploy,
              "overall": "success" if build == "success" and deploy == "success" else "failure",
              "artifact": "NCA-V9.8-Web",
              "viewer_url": "https://nyeinchanaung75299-eng.github.io/football-stream-app/",
              "admin_url": "https://nyeinchanaung75299-eng.github.io/football-stream-app/admin/",
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          Path("/tmp/web-ci.json").write_text(
              json.dumps(data, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feed
          git switch -C feed origin/feed
          mkdir -p public/ci
          cp /tmp/web-ci.json public/ci/web.json
          git add public/ci/web.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Web CI status for ${HEAD_SHA::12}"

          for attempt in 1 2 3 4; do
            if git push origin feed; then
              exit 0
            fi
            git pull --rebase origin feed
            sleep 2
          done
          exit 1
