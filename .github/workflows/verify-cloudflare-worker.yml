name: Verify Cloudflare Worker Bundling

on:
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/public-api/**"
      - "scripts/test_protected_dash_proxy.mjs"
      - "scripts/test_supabase_relay.mjs"
      - "scripts/test_public_match_feed.mjs"
      - "scripts/test_website_stream_scanner.mjs"
      - "scripts/test_browser_stream_scanner.mjs"
      - ".github/workflows/verify-cloudflare-worker.yml"

permissions:
  contents: read

jobs:
  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing worker routes and new scanner
        run: |
          node --test scripts/test_protected_dash_proxy.mjs
          node --test scripts/test_supabase_relay.mjs
          node --test scripts/test_public_match_feed.mjs
          node --test scripts/test_website_stream_scanner.mjs
          node --test scripts/test_browser_stream_scanner.mjs
      - name: Dry-run Cloudflare worker bundle
        working-directory: cloudflare/public-api
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/nca-worker-bundle
