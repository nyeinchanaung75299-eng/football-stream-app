name: Verify NCA performance changes (PR only)

on:
  pull_request:
    paths:
      - "user_app/**"
      - "supabase/functions/football-score-sync/**"
      - "supabase/functions/soco-links/**"
      - "scripts/test_fawa_source.mjs"
      - "scripts/test_performance_regressions.mjs"
      - ".github/workflows/verify-performance-pr.yml"

permissions:
  contents: read

jobs:
  performance-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR files
        uses: actions/checkout@v7

      - name: Verify browser JavaScript and player synchronization
        run: |
          node scripts/test_performance_regressions.mjs
          python3 scripts/generate_embedded_player.py --check
          node scripts/test_web_player.mjs
          node --test scripts/test_fawa_source.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test Viewer
        working-directory: user_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
