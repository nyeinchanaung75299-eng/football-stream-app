name: Verify NCA performance changes (PR only)

on:
  pull_request:
    paths:
      - "user_app/**"
      - "supabase/functions/football-score-sync/**"
      - "supabase/functions/soco-links/**"
      - "scripts/test_fawa_source.mjs"
      - "scripts/diagnose_soco_feed.mjs"
      - ".github/workflows/sync-public-feed.yml"
      - "scripts/test_soco_match_catalog.mjs"
      - "supabase/functions/_shared/source_match_rows.mjs"
      - "supabase/functions/_shared/source_team_logos.mjs"
      - "supabase/functions/_shared/football_names.mjs"
      - "scripts/test_football_names.mjs"
      - "supabase/functions/source-match-list/index.ts"
      - "scripts/test_performance_regressions.mjs"
      - "scripts/test_backend_startup.mjs"
      - "scripts/test_experimental_football_sources.mjs"
      - "supabase/functions/_shared/experimental_football_sources.mjs"
      - "admin_app/lib/screens/soco_import_page.dart"
      - ".github/workflows/verify-performance-pr.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR files
        uses: actions/checkout@v7

      - name: Verify browser JavaScript and player synchronization
        run: |
          node scripts/test_performance_regressions.mjs
          python3 scripts/generate_embedded_player.py --check
          node scripts/test_web_player.mjs
          node --test scripts/test_fawa_source.mjs

      - name: Compare Soco upstream and API fixture counts (nonblocking diagnostic)
        run: |
          node scripts/diagnose_soco_feed.mjs
          node --test scripts/test_soco_match_catalog.mjs

      - name: Verify backend startup import graph
        run: node --test scripts/test_backend_startup.mjs

      - name: Verify experimental football match parsing without invented kickoff times
        run: node --test scripts/test_experimental_football_sources.mjs

      - name: Verify YYZB fixture names and badge extraction
        run: node --test scripts/test_football_names.mjs

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze and test Viewer
        working-directory: user_app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
