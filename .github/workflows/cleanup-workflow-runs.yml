name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-workflow-runs.yml"
  workflow_run:
    workflows:
      - "Build Android V9.8 APKs"
      - "Build and Deploy Web Viewer"
      - "Deploy Cloudflare Public API"
      - "Sync Public Match Feed"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only current and latest useful runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            const corePaths = new Set([
              '.github/workflows/build-apks.yml',
              '.github/workflows/deploy-web.yml',
              '.github/workflows/deploy-cloudflare-public-api.yml',
              '.github/workflows/sync-public-feed.yml',
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 },
            );

            // Newest first so the first successful completed run for each
            // production workflow is the one worth retaining.
            runs.sort(
              (a, b) =>
                new Date(b.created_at).getTime() -
                new Date(a.created_at).getTime(),
            );

            const keep = new Set([currentRunId]);
            const latestSuccessByPath = new Map();

            for (const run of runs) {
              // Never delete queued/in-progress runs.
              if (run.status !== 'completed') {
                keep.add(run.id);
                continue;
              }

              if (
                corePaths.has(run.path) &&
                run.conclusion === 'success' &&
                !latestSuccessByPath.has(run.path)
              ) {
                latestSuccessByPath.set(run.path, run.id);
                keep.add(run.id);
              }
            }

            let deleted = 0;
            let kept = 0;
            let failed = 0;

            for (const run of runs) {
              if (keep.has(run.id)) {
                kept++;
                continue;
              }

              // Only completed runs are removable. This deletes obsolete
              // success/cancelled/failure runs from older commits together
              // with their stale logs/artifacts.
              if (run.status !== 'completed') {
                kept++;
                continue;
              }

              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                });
                deleted++;
                core.info(
                  `Deleted ${run.name} #${run.run_number} ` +
                  `(${run.conclusion || run.status}) id=${run.id}`,
                );
              } catch (error) {
                failed++;
                core.warning(
                  `Could not delete run id=${run.id}: ${error.message}`,
                );
              }
            }

            core.summary
              .addHeading('Workflow run cleanup')
              .addRaw(
                `Deleted: ${deleted}\n` +
                `Kept: ${kept}\n` +
                `Delete failures: ${failed}\n` +
                `Latest successful production runs retained: ` +
                `${latestSuccessByPath.size}\n`,
              )
              .write();
