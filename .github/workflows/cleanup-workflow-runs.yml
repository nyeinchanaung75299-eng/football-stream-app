name: Cleanup Old Workflow Runs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-workflow-runs.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete cancelled and failed runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            const removableConclusions = new Set([
              'cancelled',
              'failure',
              'timed_out',
              'action_required',
              'stale'
            ]);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              },
            );

            let deleted = 0;
            let kept = 0;

            for (const run of runs) {
              if (run.id === currentRunId) {
                kept++;
                continue;
              }

              // Never touch queued/in-progress runs or successful runs/artifacts.
              if (run.status !== 'completed' ||
                  !removableConclusions.has(run.conclusion)) {
                kept++;
                continue;
              }

              await github.rest.actions.deleteWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });

              deleted++;
              core.info(
                `Deleted ${run.name} #${run.run_number} (${run.conclusion}) id=${run.id}`,
              );
            }

            core.summary
              .addHeading('Workflow run cleanup')
              .addRaw(`Deleted: ${deleted}\nKept: ${kept}\n`)
              .write();
